id: safety/checking-habits
title: Checking habits that run when you are in a hurry
description: >-
  Find the row that does not add up in a table a chat assistant wrote, learn the four checks that
  run on everything that leaves your desk, and set how deep each one goes from the cost of being
  wrong.
mode: tutorial
covers: safety/verification
serves: [safety/verifies-output/checks-claims, safety/verifies-output/calibrates-trust]
introduces: [checking-habits]
assumes:
  - objective: safety/verifies-output/checks-claims
    lesson: safety/spotting-hallucination
    section: specificity-is-the-tell
  - objective: safety/verifies-output/calibrates-trust
    lesson: safety/when-the-tool-is-usually-right
    section: build-the-check-in
after: [safety/spotting-hallucination, safety/when-the-tool-is-usually-right]
shorts: []
exercise:
  kind: do
  brief: >-
    Apply the four checks to one AI-written document from your week: read it against the request,
    find the claims you did not supply, open one link, redo one calculation.
sources: [CS50x, Liu 2024b, Academy ai-fluency-framework-foundations]
sources-checked: 2026-09-26
review-by: 2027-03-26
issue: 120
minutes: 15
notes: >-
  The fixture site/examples/safety/checking-habits/totals.py recomputes the totals in a model-written
  summary table and flags the row that does not add up. The page shows its output in a text fence
  and carries no Predict run, because safety is a foundations area. The fixture is CI proof only,
  and how CI asserts a hidden fixture against a foundations page is decided in #237. The teams and
  the ticket counts are invented, and the page holds no person names. CS50 is cited for the
  endorsed-answers idea, in our own words, and Liu 2024b (section 3.4) for how staff can endorse,
  amend or delete the tutor's forum answers. The Academy course is linked and its Discernment
  framing paraphrased, with no text copied.
