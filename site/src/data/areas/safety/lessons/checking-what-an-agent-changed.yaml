id: safety/checking-what-an-agent-changed
title: Checking what an agent changed
description: >-
  Compare what an agent did with what you asked for, find the deleted file and the sent message its
  summary left out, and put the one pause before the step that cannot be undone.
mode: tutorial
covers: safety/verification
serves: [safety/verifies-output/calibrates-trust]
introduces: [trust-but-verify-for-agents]
assumes:
  - objective: concepts/recognizes-agents/tells-agent-from-assistant
    lesson: concepts/assistant-or-agent
    section: one-test-what-can-it-do-without-another-prompt
  - objective: safety/verifies-output/checks-claims
    lesson: safety/checking-habits
    section: the-routine
after: [safety/checking-habits]
shorts: []
exercise:
  kind: do
  brief: >-
    For one agent task you have seen or read about, list the effects to inspect afterwards (what
    changed and what was sent) and the one step that needs a pause first.
sources: [CS50x, Liu 2024b, Academy ai-fluency-framework-foundations]
issue: 128
minutes: 15
proofs: [safety/checking-what-an-agent-changed/replay.py]
notes: >-
  The fixture site/examples/safety/checking-what-an-agent-changed/replay.py replays an invented agent
  session as changes to an in-memory folder, prints the folder before and after, and marks each
  effect as asked for or not against the request. The page shows its output in text fences and
  carries no Predict run, because safety is a foundations area. The fixture is CI proof only: it
  is in proofs, so mise run examples fails when it prints a line no text fence on the page shows
  (#311). It doesn't print the request, because the page quotes it wrapped over two lines. The folder, files,
  session and summary are invented, and the page holds no person names. The CS50x course page is
  cited for the AI helper and Liu 2024b (section 3.4, Figure 3) for the endorsed forum answers, in
  our own words. The Academy course is linked and its Discernment framing paraphrased, with no
  text copied.
