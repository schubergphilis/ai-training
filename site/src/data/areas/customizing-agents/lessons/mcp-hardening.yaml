id: customizing-agents/mcp-hardening
title: Hardening a tool connection
description: >-
  Give a notes server a read-only token that expires in an hour, turn on its tool-call log, plant an
  instruction in one note, and read in the log which control stopped the send it asked for.
mode: tutorial
covers: customizing-agents/mcp
serves: [customizing-agents/connects-tools-safely/hardens-a-connection]
introduces: []
assumes:
  - objective: safety/judges-agent-risk/recognizes-injection
    lesson: safety/agent-risk
    section: prompt-injection-when-the-data-gives-orders
  - objective: safety/judges-agent-risk/names-blast-radius
    lesson: safety/agent-risk
    section: blast-radius
sources-checked: 2026-09-26
review-by: 2027-03-26
after: [customizing-agents/mcp-first-server]
shorts:
  - Tool poisoning across servers, one worked example
exercise:
  kind: do
  brief: >-
    Give the fixture server a read-only, short-lived token, turn on tool-call logging, plant an
    instruction in one note that asks the agent to send the note to an outside address, and show in
    the log or the transcript that the send was refused or asked about.
sources:
  - MCP specification
  - MCP deprecated features
  - Claude Code mcp
  - Claude Code security
  - Claude Code permission modes
  - Invariant tool poisoning
issue: 175
minutes: 15
notes: >-
  Introduces no concept: hands-on for mcp-security (scoped credentials, gated outbound abilities and a
  reviewed log). The fixtures under site/examples/customizing-agents/mcp-hardening/ are a real stdio
  MCP server in the standard library (notes_server.py) with list_notes, read_note and share_note, an
  HMAC-signed token with a scope, an expiry and an owner (notes_token.py, issue_token.py), and a JSON
  lines log (show_log.py). share_note sends nothing. The server takes its folder from its command line
  and never sends roots/list, so the page says so and has the learner start the agent inside the notes
  copy, where Claude Code's own write boundary also sits (code.claude.com/docs/en/security). The server
  marks share_note with the requiresUserInteraction flag in _meta, which makes Claude Code ask on every
  call even with an allow rule (code.claude.com/docs/en/mcp, checked with Claude Code 2.1.281 in -p
  mode, where the call was held for approval). The --env syntax for claude mcp add and local scope in
  the Claude Code config file come from the same mcp page. The short-lived token advice and "clients should log tool
  usage for audit" come from the 2026-07-28 spec (the authorization security considerations page and
  the tools page), the revision the bibliography pins, re-checked on 2026-09-26 (#442). The same
  revision deprecates roots and sampling (SEP-2577, the deprecated page), and the page says so where
  it contrasts this server with the roots-driven reference server. In a trial with a small model the model
  noticed the planted line and did not call share_note, so the exercise has the learner ask for the
  send directly as a second run. Tool poisoning and shadowing come from the Invariant Labs post.
  The permission-modes page states that Manual mode (`default`) runs only reads without a prompt,
  that Pro, Max and Team plans start in auto mode, and that no mode auto-approves a
  requiresUserInteraction tool, which needs v2.1.199 or later (mcp page). show_log.py quotes every
  argument value so model text can't forge a log line.
