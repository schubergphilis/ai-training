id: customizing-agents/load-point-prune
title: Load it, point at it, or cut it
description: >-
  Take a long instruction file, keep what nearly every task needs, point at the rest with one line
  each, and cut every line whose removal would cause no mistake.
mode: tutorial
covers: customizing-agents/instructions
serves: [customizing-agents/configures-agent/chooses-load-or-point, customizing-agents/configures-agent/prunes-instructions]
introduces: [loading-versus-pointing, pruning-instructions]
assumes:
  - objective: customizing-agents/configures-agent/writes-project-instructions
    lesson: customizing-agents/instructions
    section: what-doesnt-belong
extends-to:
  - label: Path-scoped rules in Claude Code
    href: https://code.claude.com/docs/en/memory#path-specific-rules
after: [customizing-agents/instructions]
shorts: []
exercise:
  kind: do
  brief: >-
    Go through a long instruction file line by line, keep what the agent needs in every session,
    move the rest into files the instructions point at, and delete what the agent can work out from
    the code.
sources: [Claude Code memory, Claude Code best practices, Anthropic context engineering]
sources-checked: 2026-10-07
review-by: 2027-04-07
issue: 686
minutes: 15
notes: >-
  Pruning is the expert objective, so the lesson ends on it. Instruction dilution
  (concepts/what-tokens-cost, section the-rule-that-got-buried, live) is the reason short files work
  better, and the page links back to it. The exercise uses a sample file, AGENTS.long.md in
  site/examples/customizing-agents/load-point-prune/, copied to a scratch folder, instead of the
  learner's own project file, and the learner's own file is the stretch goal, on a branch. The sample
  continues the invoice-mailer project from the instructions lesson. AGENTS.pruned.md and docs/ are
  one model answer, and AGENTS.imports.md is the same file with the two pointers replaced by @path
  imports. startup.py counts the lines loaded at start-up under Claude Code's import rule from the
  memory page (expanded at launch, relative to the importing file, code spans and fences skipped,
  four hops). The loading facts (instruction files read every session, imports load at launch,
  path-scoped rules and skills load on demand, conflicting lines may be followed either way,
  /doctor prompt-audit) come from code.claude.com/docs/en/memory, and the line test and testing by
  watching behavior from code.claude.com/docs/en/best-practices. Re-check both by review-by. The
  competency behavior that cites the context engineering article for "a bare path is often skipped"
  is not stated there, so the page grounds the pointer wording in the memory page's sentence about a
  CLAUDE.md that tells Claude in words to read AGENTS.md, and cites the article only for
  just-in-time loading.
