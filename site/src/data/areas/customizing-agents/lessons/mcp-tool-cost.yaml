id: customizing-agents/mcp-tool-cost
title: Measuring what a tool server costs
description: >-
  Count what a twenty-tool server's definitions take from the context window, run one query through the
  server and through a CLI, and decide which tools and servers stay connected.
mode: tutorial
covers: customizing-agents/mcp
serves: [customizing-agents/connects-tools-safely/weighs-tool-cost]
introduces: []
assumes:
  - objective: concepts/explains-models/explains-generation
    lesson: concepts/what-tokens-cost
    section: what-a-token-costs
  - objective: customizing-agents/connects-tools-safely/adds-a-tool
    lesson: customizing-agents/mcp-first-server
    section: connect-the-real-server
sources-checked: 2026-09-26
review-by: 2027-03-26
after: [customizing-agents/mcp-first-server]
shorts:
  - On-demand tool loading and why disabling unused servers is still the control (Academy claude-code-101)
exercise:
  kind: judge
  brief: >-
    Connect a server with many tools, read the token count of its definitions from the client, then
    compare one query through the server with the same query through the CLI, and record both costs
    in a short table.
