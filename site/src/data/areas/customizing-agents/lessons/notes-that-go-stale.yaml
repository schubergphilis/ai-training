sources: [Claude Code memory]
issue: 688
minutes: 10
notes: >-
  "Check a note against the code before acting on it" is our wording. The memory page supports
  that notes go stale, and has no rule of its own for it. The page says so in the section that
  states the rule. Vendor claims, all from code.claude.com/docs/en/memory: memory and instruction
  files load at the start of every session and are context rather than enforced configuration;
  memory files are excluded from the transcript cleanup and stay until edited or deleted; the
  reminder to drop stale entries comes when MEMORY.md nears its read limit; the `modified`
  frontmatter field (v2.1.214 or later, only for files with frontmatter) records the write time;
  `project` notes hold what the code and git history don't show, and Claude skips what it can
  derive from the code. The exercise uses its own five notes for an invoice tool, so its good
  result gives away no checkpoint. No fixture: nothing on the page runs. Added a
  `session-handoff` extends-to, since a handoff is the next secondary source the course writes.
