id: customizing-agents/adopting-a-skill-set
title: Adopting a published skill set
description: >-
  Vet an invented skill set skill by skill for license, maintenance, scripts and pre-approved tools,
  take two of its skills, and check what they change in a session against what they add to the
  context.
mode: tutorial
covers: customizing-agents/skills
serves: [customizing-agents/adopts-a-skill-set/vets-a-skill-set, customizing-agents/adopts-a-skill-set/adopts-skills-gradually]
introduces: [published-skill-sets]
assumes:
  - objective: customizing-agents/writes-skill/evaluates-a-plugin
    lesson: customizing-agents/plugins
    section: install-it-copy-one-skill-or-leave-it
  - objective: customizing-agents/writes-skill/discloses-progressively
    lesson: customizing-agents/progressive-disclosure
    section: what-the-agent-reads-and-when
extends-to: []
sources-checked: 2026-10-07
review-by: 2027-04-07
after: [customizing-agents/plugins]
shorts: []
exercise:
  kind: do
  brief: >-
    Vet one public skill set as you would a library, install two of its skills, and compare what
    they change in a session against what they add to the context.
sources:
  - Claude Code skills
