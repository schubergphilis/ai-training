id: customizing-agents/first-hook
title: Writing a hook that blocks a mistake
description: >-
  Write a Claude Code hook that runs before each commit and blocks it when the lockfile changed and
  the manifest did not, test it by hand, then make the mistake on purpose and read what the agent does
  with the message.
mode: tutorial
covers: customizing-agents/hooks-permissions
serves: [customizing-agents/configures-agent/adds-a-hook]
introduces: [hooks]
assumes:
  - objective: coding-with-agents/verifies-agent-work/automates-the-check
    lesson: coding-with-agents/self-checking-loops
    section: write-the-check-as-a-test
  - objective: customizing-agents/configures-agent/sets-permissions
    lesson: customizing-agents/allowlists
    section: run-two-write-the-allowlist
extends-to:
  - label: "How to actually force Claude Code to use the right CLI (video)"
    href: https://www.youtube.com/watch?v=3CSi8QAoN-s
sources-checked: 2026-09-25
review-by: 2027-03-25
after: [customizing-agents/allowlists]
shorts:
  - The hook exit-code contract, and what the agent sees when a hook blocks (Academy claude-code-101)
exercise:
  kind: do
  brief: >-
    Write a pre-tool hook that rejects a commit when the lockfile changed and the manifest did not,
    with the message that says what to do, then make the mistake on purpose and watch it fire.
sources: [Claude Code hooks, Claude Code hooks guide, Git docs git-diff, Git docs git-commit]
issue: 184
minutes: 25
notes: >-
  The pitfall carries the rule from when-instructions-are-not-enough: a rule that must hold every
  time needs a mechanism (a hook, with CI behind it), and guidance stays an instruction. The fixture repository is a tiny npm project
  whose `package.json` and `package-lock.json` are committed as `package.sample.json` and
  `package-lock.sample.json`, so no dependency tool or scanner reads them as a real project, and the
  learner renames them in their copy. `harness.py` feeds `lockfile_guard.py` the PreToolUse JSON
  that Claude Code sends, with an allow-list environment for git. The hook compares the working tree
  with HEAD, staged or not, because it runs before the command and can't know what a `git add` in
  the same command will stage, and it adds untracked files. It fails closed (exit 2) on input it
  can't read and when git can't answer, and matches `git ... commit` with a regular expression, so the
  `if` filter is `Bash(git *)`. The page says what the text match misses and names permission rules and
  CI as the hard controls. Only the personal `.claude/settings.local.json` is used: sharing a
  hook with a team is the ci-and-hooks lesson (#186). The exit-code contract, the event names, the
  `if` field, exec form, workspace trust and what Claude sees on a block come from
  code.claude.com/docs/en/hooks and /hooks-guide and must be re-checked by review-by.
