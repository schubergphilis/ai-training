      - customizing-agents/testing-a-skill
      - customizing-agents/progressive-disclosure
      - customizing-agents/plugins
      - customizing-agents/adopting-a-skill-set
  - title: Connecting tools with MCP
    lessons:
      - customizing-agents/mcp
      - customizing-agents/mcp-first-server
      - customizing-agents/logging-from-a-stdio-server
      - customizing-agents/mcp-tool-cost
      - customizing-agents/mcp-hardening
  - title: Inspecting the agent
    lessons: [customizing-agents/seeing-what-the-agent-sends]
  - title: Hooks, permissions, settings
    lessons:
      - customizing-agents/permission-modes
      - customizing-agents/allowlists
      - customizing-agents/settings-layering
      - customizing-agents/first-hook
      - customizing-agents/project-stays-in-charge
