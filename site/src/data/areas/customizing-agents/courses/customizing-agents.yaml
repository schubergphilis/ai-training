id: customizing-agents
area: customizing-agents
plan-issue: 34
notes: >-
  Order: instructions, skills, mcp, inspecting-the-agent, hooks-permissions, memory. That follows the prerequisite edges
  in spec S02: skills and mcp need instructions, hooks-permissions needs instructions and
  safety/agent-risk, memory needs skills. Inspecting the agent follows mcp because its lesson
  measures what a connected tool adds to each request. Memory comes last because its closing lesson sends
  repeated work into instructions, skills and hooks.
parts:
