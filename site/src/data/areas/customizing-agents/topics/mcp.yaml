id: customizing-agents/mcp
area: customizing-agents
name: Connecting tools with MCP
definition: >-
  The Model Context Protocol is a standard way to expose tools and data to
  an agent through a server the agent's client connects to. This topic covers
  the server and client roles, the transports that connect them, the
  primitives a server or a client can offer, when a plain command-line tool
  is the better choice, what a tool costs in tokens, and the security
  consequences of connecting one.
concepts:
  - id: server
    name: Server
    definition: >-
      The process that exposes tools, resources and prompts over the
      protocol. A server wraps something, a database, an API, a file system,
      a browser, and describes each tool with a name, a purpose and a
      parameter schema the model can read. Write or install a server once
      and any compliant agent can use it, which is the protocol's point.
  - id: client
    name: Client
    definition: >-
      The side inside the agent application that connects to servers, lists
      the tools they offer, passes those descriptions to the model, executes
      the model's tool calls against the right server and returns results.
      The client and the host application around it hold the connection
      configuration, the approval prompts and the permission checks, so they
      are where a user controls what a server may do.
  - id: transport
    name: Transport
    definition: >-
      How client and server exchange messages. A local server usually runs as
      a child process talking over standard input and output. A remote one
      is reached over HTTP, often with streaming. The transport decides where
      the server's code runs and what credentials it holds, which makes it a
      security decision as much as a plumbing one.
  - id: mcp-primitives
    name: MCP primitives
    definition: >-
      The features a server or a client can offer. In revision 2026-07-28,
      a server offers tools the model calls, resources with a URI that the
      user or the model reads as context, and prompts the user picks by name.
      A client can offer elicitation, so a server can ask the user for more
      input. That revision deprecates roots and sampling. Roots name the
      directories a client finds relevant, and the protocol doesn't enforce
      them. Sampling lets a server ask the client's model for a completion.
  - id: mcp-vs-cli
    name: MCP vs CLI
    definition: >-
      An agent can often reach the same system through a protocol server or
      by running a command-line tool it already knows. A server gives typed
      tools, discoverability and a stable interface across agents. A CLI is
      already installed, costs no tool descriptions in context and is easy to
      audit. Prefer the CLI when it exists and is good. Add a server when
      the interface needs shaping.
  - id: tool-cost
    name: Tool cost
    definition: >-
      Every connected tool adds to the context on every turn. Without tool
      search that is its full description. With tool search, which Claude
      Code uses by default, only the tool's name and its server's
      instructions load until the model searches for the tool. Every call
      adds its result, and verbose results crowd out the conversation.
      Connect only the servers a project needs, prefer servers with few
      well-described tools, and watch result sizes.
  - id: mcp-security
    name: MCP security
    definition: >-
      Connecting a server lets the agent reach everything the server can
      reach. Risks include servers from untrusted sources, tool descriptions
      that carry injected instructions, tools that return attacker-controlled
      content, and tools that can send data outward. Vet the source, run with
      least privilege, approve risky tools per call and review what leaves.
      Connect a server with your own identity, never with a shared service
      account, so it can do only what you may do and its actions trace back
      to you.
  - id: stdio-logging
    name: Stdio logging
    definition: >-
      On the transport over standard input and output, the server's standard
      output carries protocol messages only, and the specification forbids
      writing anything else there. A stray print statement or a library's log
      line corrupts the message stream, and the client fails in ways that are
      hard to trace. Logs go to standard error, which the client may capture,
      show or ignore, and which it does not treat as a sign of failure.
