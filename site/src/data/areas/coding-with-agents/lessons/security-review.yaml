id: coding-with-agents/security-review
title: Reading agent code as if the input were hostile
description: >-
  Run a static analyzer over an agent-written search function, find the string-built query it
  reports and the swallowed error it misses, and brief the agent for a parameterized fix with a test.
mode: tutorial
covers: coding-with-agents/quality
serves: [coding-with-agents/verifies-agent-work/screens-for-security]
introduces: [security-review-of-agent-output]
assumes:
  - objective: safety/judges-agent-risk/names-blast-radius
    lesson: safety/agent-risk
    section: blast-radius
  - objective: safety/judges-agent-risk/recognizes-injection
    lesson: safety/agent-risk
    section: prompt-injection-when-the-data-gives-orders
after: [coding-with-agents/tests-and-docs-that-hold]
shorts: [the classic mistakes agents copy from their training data]
exercise:
  kind: do
  brief: >-
    Install Bandit 1.8.6 into a throwaway virtual environment outside the course repository, run it
    on a copy of an agent-written fixture change, find the string-built query it reports and the
    swallowed error it misses, and brief the agent for the parameterized version with a test that
    fails on the old code. Running Bandit on a public project is the stretch goal.
sources: [Academy claude-code-in-action, Brilliant SEC, Pearce 2022, Bandit, Bandit PyPI, Python sqlite3]
issue: 178
minutes: 15
sources-checked: 2026-09-27
review-by: 2027-03-27
notes: >-
  Sources: Brilliant SEC-3, Academy claude-code-in-action (paraphrased). The exercise installs one
  pinned tool, Bandit 1.8.6, into a virtual environment outside the course repository, under the S03
  rule decided in https://github.com/schubergphilis/ai-training/issues/461. Bandit 1.8.6 declares Python
  >=3.9 on PyPI, and its classifiers list 3.9 to 3.13. Both pasted outputs were produced on
  2026-09-27 with Bandit 1.8.6 on Python 3.9.25 (mise), installed with `uv pip install --python
  <venv>/bin/python bandit==1.8.6` into a `python3.9 -m venv` environment, from a fresh copy of
  site/examples/coding-with-agents/security-review/, by `bandit -q notes_search.py` (exit status 1,
  the page drops the start line and the summary) and `bandit -q fixed/notes_search.py` (no output,
  exit status 0). The same day, the page's own steps ran on macOS /usr/bin/python3 3.9.6:
  `python3 -m venv`, then `<venv>/bin/pip install bandit==1.8.6` (pip 21.2.4), then the run in a
  fresh ~/search-fix copy printed the same findings. With uvx, 3.10.21 and 3.11.16 printed the B608
  location as 22:8, and 3.12.14 and 3.13.15 as 22:10, with the same findings. On 3.14.7 it printed
  two ERROR lines for notes_search.py and exited with status 0, which is why the page tells a
  learner on 3.14 or newer to use the system Python or skip the install. Re-run all of these when
  the review date comes.
