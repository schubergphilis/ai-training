id: coding-with-agents/self-checking-loops
title: Giving the agent a check it can run, with a limit
description: >-
  Turn the reproduction steps of the nightly sales import into a test the coding agent runs after
  every change, brief the fix-and-rerun loop with a limit of five attempts and a read-only test
  file, confirm with git that the test did not change, and tell the deterministic gates that can
  block a merge from a second model's opinion.
mode: tutorial
covers: coding-with-agents/verification
serves:
  - coding-with-agents/verifies-agent-work/automates-the-check
  - coding-with-agents/verifies-agent-work/prefers-gates-to-opinions
introduces: [bounded-self-checking-loops, deterministic-gates]
assumes:
  - objective: safety/verifies-output/checks-claims
    lesson: safety/spotting-hallucination
    section: run-the-check
  - objective: coding-with-agents/verifies-agent-work/observes-and-debugs
    lesson: coding-with-agents/observing-and-debugging
    section: reproduce-it-first
after: [coding-with-agents/observing-and-debugging]
shorts: [why a second model's review never replaces a test]
exercise:
  kind: do
  brief: >-
    Run the lesson's test, written from the fixture's manual reproduction steps, and brief the agent
    to fix and rerun at most five times with the test file read-only. Afterwards, confirm with git
    that the test did not change and no file was added, and run the test yourself.
sources:
  - Academy ai-native-sdlc-playbook
  - Academy claude-code-in-action
  - Brilliant VER
  - Claude Code best practices
  - Claude Code permissions
issue: 174
minutes: 15
sources-checked: 2026-09-25
review-by: 2027-03-25
notes: >-
  The plan named the topic safety/verification as assumed; taken as the objective
  safety/verifies-output/checks-claims, taught where the learner runs a checker instead of trusting
  a summary. The page opens from the previous lesson's reproduction steps, so it also assumes
  observes-and-debugs. Closes the "deterministic gates" gap from issue #13. Sources: Brilliant
  VER-6, Academy claude-code-in-action (gating on real test results, paraphrased from the public
  course page), Academy ai-native-sdlc-playbook (a check the agent can run is run every iteration,
  paraphrased), Claude Code best practices (a check that returns pass or fail, a Stop hook as a
  gate, a reviewer that reports gaps even in sound work), Claude Code permissions (what an Edit
  deny rule does and doesn't cover). The fixtures under
  site/examples/coding-with-agents/self-checking-loops/ copy the observing-and-debugging nightly/
  directory to a temporary place, add test_nights.py, tag a commit before-run, and apply either
  the bounded run's fix with the CSV module or an unbounded run that skips bad rows and deletes the row check from
  the test. The test counts the data rows itself so that a skip-the-row fix fails. The fix's two
  text edits are read with ast from observing-and-debugging/after_fix.py, and only the added
  `import csv` line is repeated in _common.py. The gate-or-opinion checkpoint and its review
  alternate serve prefers-gates-to-opinions, added in issue #408, and the other checkpoints serve
  automates-the-check. The three first checkpoints left on automates-the-check test its three
  behaviors of the bounded loop (a check the agent can run, a limit in the brief, a protected
  test), and each of them has a review alternate of its own.
