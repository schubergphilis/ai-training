id: coding-with-agents/agent-interviews-you
title: Let the agent interview you
description: >-
  Have the agent interview you about a feature before any plan exists, answer with decisions or "not
  decided yet", write the settled terms down, and check that the spec and a fresh session's plan use
  them.
mode: tutorial
covers: coding-with-agents/specification
serves: [coding-with-agents/specifies-work/is-interviewed-before-planning]
introduces: [design-interview, shared-vocabulary]
assumes:
  - objective: coding-with-agents/specifies-work/defines-success
    lesson: coding-with-agents/deciding-what-to-build
    section: writing-down-what-success-requires
extends-to:
  - label: Domain-Driven Design Reference (Eric Evans), the Ubiquitous Language pattern
    href: https://www.domainlanguage.com/ddd/reference/
after: [coding-with-agents/deciding-what-to-build]
shorts: []
exercise:
  kind: do
  brief: >-
    Ask an agent to interview you about a small feature until the two of you agree on the design,
    then write down the terms you settled on and check that the plan it writes uses them.
sources: [Claude Code best practices, Claude Code memory, Evans 2003, Evans DDD Reference]
sources-checked: 2026-10-07
review-by: 2027-04-07
issue: 677
minutes: 15
notes: >-
  The interview comes before decomposing-the-work: it settles what the feature is, and the next
  lesson cuts it into components. The shared vocabulary is the list of terms the interview fixes,
  in plain words, without the rest of domain-driven design. Built as written in the plan. The
  fixture is the three-module to-do program copied from decomposing-the-work, and the feature is an
  archive command that is designed in the page and never built. The exercise uses a different
  feature, an undo for done, so the learner doesn't run the same interview twice. The term list
  format and `check_terms.py` are this lesson's own, so a learner can check a spec and a plan for
  drifted words. The interview exchange is illustrative. Evans 2003 is cited only for domain-driven
  design as the idea's origin. What the page says about one language in speech, writing and code,
  and a change in the language being a change to the design, is from the free Evans DDD Reference
  (CC BY 4.0), whose pattern is named only in the extends-to label because Vale rejects the word on
  the page. Every Claude Code session runs with CLAUDE_CODE_DISABLE_AUTO_MEMORY=1, so the fresh
  session starts without notes from the interview (Claude Code memory). The page names
  deciding-what-to-build instead of saying "the previous lesson", and decomposing-the-work now names
  it instead of "the last lesson", with an assumes entry for it.
