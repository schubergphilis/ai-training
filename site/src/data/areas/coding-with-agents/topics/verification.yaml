id: coding-with-agents/verification
area: coding-with-agents
name: Verifying agent work
definition: >-
  Code you did not write needs a different kind of reading. This topic covers
  reviewing an agent's diff against the specification rather than for
  plausibility, observing the system as it runs, narrowing a fault
  systematically, turning checks into loops the agent can run itself within
  limits you set, relying on deterministic gates over model opinions, and
  attacking your own agent before someone else does.
concepts:
  - id: reviewing-code-you-did-not-write
    name: Reviewing code you did not write
    definition: >-
      Reading an agent's diff as a reviewer, not an author: you have no
      memory of why each line exists, so every line has to justify itself.
      Look for changes outside the brief, silent behavior changes, deleted
      tests, copied patterns applied wrongly and comments that describe
      intent rather than what the code does. Read the code, not the agent's
      summary of it.
  - id: verifying-against-the-specification
    name: Verifying against the specification
    definition: >-
      Checking the result against the success criteria written before the
      work, item by item, instead of judging whether the change looks
      reasonable. This catches the plausible-but-wrong result, the criterion
      quietly dropped and the edge case skipped. If a criterion cannot be
      checked, either the spec or the verification design needs fixing
      before the change is accepted.
  - id: observing-a-running-system
    name: Observing a running system
    definition: >-
      Running the changed software and watching what it actually does: the
      logs it writes, the requests it makes, the state it leaves behind, the
      screen it renders. Tests prove what they cover; observation catches
      what nobody thought to test. For agent work, running it yourself is
      also the check that the agent's report of "tests pass" is true.
  - id: isolating-a-fault
    name: Isolating a fault
    definition: >-
      Narrowing a failure to its cause by systematic steps: reproduce it,
      shrink the input, bisect the change, add observation at the boundary,
      confirm the hypothesis before fixing. Agents can help at each step but
      will also guess fixes; insisting on a reproduced, explained cause
      before any patch is what keeps the fix from becoming a new bug.
  - id: bounded-self-checking-loops
    name: Bounded self-checking loops
    definition: >-
      Giving the agent a check it can run itself, such as a test suite, a
      linter or a build, and letting it iterate until the check passes, with
      a limit on attempts and a rule for what it may change. The bound
      matters: an unbounded loop will eventually satisfy the check by
      weakening it. The human verifies the check is still honest at the end.
  - id: deterministic-gates
    name: Deterministic gates
    definition: >-
      Checks whose outcome does not depend on a model's judgment: tests, type
      checks, linters, builds and schema validation. They give the same
      answer for the same input, so they can block a merge. A review by
      another model adds a second opinion and finds things a gate cannot,
      but it can be wrong or be persuaded in the same way as the first
      model, so it never replaces the gate.
  - id: red-teaming-your-own-agent
    name: Red-teaming your own agent
    definition: >-
      Deliberately trying to make your own agent misbehave before relying on
      it: feeding it a file with hidden instructions, pasting it a web page
      you did not read, asking for something its permissions should stop,
      giving it an ambiguous brief and seeing how far it runs. The aim is to
      learn what it does under pressure, in a sandbox where nothing real can
      be damaged. What you find becomes a permission change, an instruction
      or a gate.
  - id: fresh-context-review
    name: Fresh-context review
    definition: >-
      A review by an agent session that did not write the change. It gets
      the diff, the specification and the criteria to check, and none of the
      reasoning that produced the change, so it judges the result on its own
      terms. A reviewer asked for gaps finds some even in sound work, so it is
      told to report only what affects correctness or the stated
      requirements. Its findings are advice a person weighs, next to the
      deterministic gates that decide whether a change merges.
