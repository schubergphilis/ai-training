id: coding-with-agents/works-in-team
area: coding-with-agents
statement: Works with agents alongside a team
topics: [coding-with-agents/team, coding-with-agents/workflow]
objectives:
  - id: coding-with-agents/works-in-team/attributes-honestly
    statement: Attributes agent work honestly in commits and reviews
    level: base
    behaviors:
      - claim: Commits and pull requests say that an agent wrote the change, in the form the team agreed on.
        why: Reviewers read agent-written and human-written changes differently, and they need to know which
          one they have.
        example: The commit trailer names the agent and model, per the repository's convention, on every
          agent-authored commit.
      - claim: The learner takes responsibility for the change as its author, and the attribution does not
          shift blame to the tool.
        why: The person who submitted the change is accountable, and the tool is not.
        example: In the review the learner writes "I asked the agent for this and I checked it", instead of
          "the agent did this".
      - claim: The learner keeps the attribution form the project asks for, including what it forbids.
        why: Some projects need a certificate of origin only a person can sign, and an agent's sign-off is
          not valid.
        example: The learner adds the assisted-by trailer and leaves out `Signed-off-by` because the project
          says only humans certify.
  - id: coding-with-agents/works-in-team/follows-team-norms
    statement: Follows the team's review and CI norms for agent changes
    level: base
    behaviors:
      - claim: Agent-written changes go through the same review and CI gates as any other change, and the
          learner does not bypass them because "the agent tested it".
        why: The gates exist for changes from anyone, and an agent's tests are part of the change under
          review.
        example: The learner waits for CI and a reviewer's approval on the agent's pull request instead of
          merging it themselves.
      - claim: The learner sizes and labels agent changes so reviewers can read them.
        why: A reviewer who receives a 3000-line agent diff either skips it or blocks it.
        example: The learner splits the generated change into three pull requests and marks them as
          agent-assisted in the title, as the team asked.
      - claim: The learner reads and follows the team's agent instructions file before starting, and
          proposes changes to it instead of working around it.
        why: The file is the team's shared agreement, and a session that ignores it makes changes the team
          rejects.
        example: The instructions say "no new dependencies without an issue", so the learner opens the issue
          first.
  - id: coding-with-agents/works-in-team/keeps-the-backlog-reachable
    statement: Keeps specs and tickets where the team and the agent can both reach them
    level: base
    behaviors:
      - claim: Specs and tickets go into the team's tracker, and the learner keeps none of them only in a
          private note or a chat.
        why: Work that is only in one person's notes is invisible to the rest of the team and to every
          agent session.
        example: The learner turns the plan from a chat into three tickets, each linking the spec, before
          any agent starts on them.
      - claim: The learner records which ticket blocks which with the tracker's own links.
        why: The tracker then marks blocked tickets, so a person or an agent picking up work can skip them
          (@GitHub docs creating-issue-dependencies).
        example: The ticket for the login page is marked as blocked by the token ticket, and the agent
          asked for the next open ticket takes the token one.
      - claim: The agent reaches the tracker through a command-line tool with credentials that allow only
          what it needs.
        why: A command-line tool costs little context, and narrow credentials limit what a wrong command
          can do (@Claude Code best practices).
        example: The agent's token can read tickets and add comments, and it cannot delete tickets or
          change the project's settings.
  - id: coding-with-agents/works-in-team/turns-findings-into-rules
    statement: Turns recurring review findings into written standards or automated checks
    level: base
    behaviors:
      - claim: When the same review finding comes up again, the learner adds it to the team's standards
          file.
        why: A rule written down once is read by every reviewer and every agent, and a finding repeated in
          comments is forgotten (@Claude Code memory).
        example: After the third comment about logging personal data, the learner adds the rule to the
          standards file with an example of what to log instead.
      - claim: A rule that a linter or a hook can check moves out of the file and into the check.
        why: A written rule is advice the agent may miss, and a check runs on every change (@Claude Code
          best practices).
        example: The rule "no print statements in library code" becomes a lint rule, and the line in the
          standards file is deleted.
      - claim: Reviewers block a change only for a rule in the file or a failed check, and mark other
          points as suggestions.
        why: A review that blocks on personal preference makes the standard unclear and the rules in the
          file worth less (@Google eng-practices).
        example: 'A reviewer writes "Nit: I would name this differently" and approves, because naming is
          not covered by the file.'
  - id: coding-with-agents/works-in-team/runs-parallel-work
    statement: Runs several agent sessions without losing coherence
    level: expert
    behaviors:
      - claim: Each parallel session works in its own checkout or worktree on its own branch, with a task
          that does not overlap the others.
        why: Two agents editing the same files produce conflicts that cost more than the parallelism saved.
        example: The learner briefs one agent on the API change and another on the documentation, in two
          worktrees, and merges the API first.
      - claim: The learner keeps a written list of what each session is doing and what state it is in.
        why: A person can follow only one session closely at a time, and a forgotten session is a session
          that finished the wrong way.
        example: "A short note per session: branch, task, next check-in, and whether it is waiting on the
          learner."
      - claim: The learner integrates often and in a fixed order, and rebases the rest.
        why: Parallel branches drift, and the longer they live the harder they merge.
        example: Every afternoon the learner merges the finished branches into main and has the remaining
          sessions rebase before they continue.
      - claim: Shared resources (ports, databases, the stash, credentials) are either per session or left
          alone.
        why: Sessions that share a port or a stash interfere with each other without any visible conflict.
        example: The learner tells each agent not to start the dev server, because the port is shared, and
          to run the build instead.
  - id: coding-with-agents/works-in-team/sets-team-practice
    statement: Sets the team's practice for agent use
    level: expert
    behaviors:
      - claim: "The learner writes the team's agent practice down where the team and the agents read it:
          what agents may do, how work is attributed, how it is reviewed."
        why: Unwritten practice is a different practice per person, and the agents follow none of them.
        example: The repository's `AGENTS.md` says what the CI gate is, what a commit trailer looks like,
          and which directories agents may not touch.
      - claim: The practice starts from the mistakes the team has seen and changes when the mistakes change.
        why: A practice written from imagination guards against the wrong things.
        example: After two incidents of agents committing generated lockfiles, the team adds a hook and a
          line in the instructions, and removes a rule that never triggered.
      - claim: The learner makes the practice checkable by tooling where possible.
        why: A rule enforced by a hook is followed every time, and a rule in a document is followed by
          whoever read it.
        example: A lint hook checks the commit message format, and CI checks the attribution trailer.
