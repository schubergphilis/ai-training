notes: >-
  Live. The content "Building your first agent" leaves out on purpose: one full request (system
  prompt, tool definitions with a JSON schema, message list) and one full response, then the tool
  result message and the second request that carries the whole history again. Shows how the fake
  model's `tool` and `answer` keys map onto the request block, its id and the stop reason. The
  message formats follow the public Claude API tool-use pages and the fixture
  site/examples/building-agents/how-a-model-calls-a-tool/wire.py prints them from a fake endpoint.
  The N x M problem closes the lesson and sets up agent-protocols (Academy
  introduction-to-model-context-protocol). Academy claude-platform-101 was in the plan and is not
  cited by the page. The agent-loop lesson's page does not yet name this lesson in an `assumes`, so
  both render at the top row of the graph. Its follow-up should add one.
