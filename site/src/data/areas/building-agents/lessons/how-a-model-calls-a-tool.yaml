id: building-agents/how-a-model-calls-a-tool
title: What a tool call looks like on the wire
description: >-
  The request, the tool_use reply, the tool_result message and the final answer of one real API
  tool call, mapped onto the fake model of the first agent lesson.
mode: explanation
covers: building-agents/tool-use
serves: [building-agents/builds-agent-loop/defines-a-tool]
introduces: [function-calling, n-x-m-integration-problem]
assumes:
  - objective: concepts/recognizes-agents/names-the-loop
    lesson: concepts/agent-loop
    section: observe-think-act
after: []
shorts: []
exercise:
  kind: judge
  brief: >-
    Given the fake model reply `{"tool": "get_weather", "args": {"city": "Lisbon"}}` from "Building
    your first agent" and the tool's result, write the three real API messages they become (the tool
    request block with its id, the tool result message that quotes that id, and the final text
    reply), then mark which field plays the role of the fake model's `answer` key.
