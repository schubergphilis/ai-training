id: building-agents/approving-a-tool-call
title: Approving a risky tool call
description: >-
  Make the loop stop before a refund tool runs, show a person the call and its exact arguments, and
  send a refusal back to the model as the tool's result.
mode: tutorial
covers: building-agents/tool-use
serves: [building-agents/builds-agent-loop/gates-risky-tools]
introduces: [tool-approval]
assumes:
  - objective: building-agents/builds-agent-loop/implements-the-loop
    lesson: building-agents/agent-loop
    section: the-loop
  - objective: safety/judges-agent-risk/chooses-human-in-loop
    lesson: safety/agent-risk
    section: human-in-the-loop
  - objective: building-agents/builds-agent-loop/defines-a-tool
    lesson: building-agents/tool-errors
    section: say-what-went-wrong-as-data
extends-to: []
after: [building-agents/tool-errors]
shorts: []
exercise:
  kind: do
  brief: >-
    Add an approval step to the loop for the one tool that changes data, show the person the call
    and its arguments, and send a refusal back to the model as a tool result.
sources: [Claude Code agent sdk permissions, Claude Code agent sdk user input]
issue: 674
minutes: 15
sources-checked: 2026-10-07
review-by: 2027-04-07
notes: >-
  Runs against the fake model with a fixture under site/examples/building-agents/, like the other
  lessons of the course. start.py is the tool-errors loop with a read tool and a refund tool and no
  gate, and it is the exercise's starting file. agent.py adds a needs_approval flag per tool and an
  ask_person step that prints every argument. The approved and refused steps feed a fixed answer
  through a stand-in for input(), so CI runs both answers, and the ask step reads the keyboard. The
  page reuses the ok False error result from tool-errors for the refusal, so it adds an assumes entry
  for the defines-a-tool objective, taught in the say-what-went-wrong-as-data section of tool-errors,
  which the plan didn't have. The three first checkpoints and the three review alternates all serve
  gates-risky-tools, and each alternate stands for one of the objective's three behaviors: the Match
  for which tools wait, the MultiChoice for what the person is shown, and the Scenario for sending a
  denial back as the tool's result.
