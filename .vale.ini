# Acronyms asks each file to spell out an acronym once, "Term (ACR)".
# Lessons only: the plan notes and specs are full of codes that are not
# acronyms. The ones this audience reads without help are exempted in
# accept.txt; MCP, RAG and LLM are deliberately not, so the lesson that
# introduces them defines them.
Google.Acronyms = warning

[*.{yaml,yml}]
BasedOnStyles = Vale
Vale.Spelling = NO
# The bibliography's `url` values are URLs, and a URL path is lowercase by
# convention (`.../with-anthropic/`, `cs50.harvard.edu`), so Vale.Terms
# must not read them as miscased names. `TokenIgnores` only applies to
# markup formats, and Vale reads YAML as plain text (`[formats]` cannot
# remap a known extension), so `mise run prose` passes the YAML files with
# `--ext=.md`. Only Vale.Terms runs on them, so the Markdown parsing
# changes nothing else. The second and third patterns are the
# `Academy <slug>` and `Claude support <slug>` citation keys (spec S02):
# the slug is a lowercase URL path segment (`introduction-to-claude-cowork`,
# `get-started-with-claude-cowork`), so it is not a miscased name either
# (issue #561). The `\s` also matches a line break, so the key is ignored
# where a line wraps between its words (issue #453).
TokenIgnores = (https?://\S+), (Academy\s[a-z0-9-]+), (Claude\ssupport\s[a-z0-9-]+)
