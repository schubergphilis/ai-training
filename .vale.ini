# Three rules run as House copies instead (.vale/styles/House/, warning by
# default): Transitions is FormalTransitions without "for example" and
# case-sensitive, so only the sentence-initial "Hence" or "Notably" fires;
# VerbTricolon is the package rule without the after-colon and -s tokens,
# which matched noun lists; Idioms is FigurativeIdioms without "blast
# radius", the safety lesson's defined term, which the package rule can't
# exempt because it has no `exceptions` key.
#
# Off: the rules that flag this project's own vocabulary or conventions.
# AnthropomorphicCognition (34 of 42 hits are "teaches"; a lesson teaches),
# ShipOveruse (Ship is a development phase here), BareNames and BareReaches
# ("names what an action can reach" is a learning objective), LabelAndExplain
# ("The rule: ..." closes every Pitfall, per spec S03), FormalRegister (10 of
# 12 hits are "implement", software vocabulary), HouseStyle (the project's
# own style is named House), EnforcementMetaphors ("gate" is the CI
# vocabulary), FigurativeDraws ("Draws on topics" is a spec column),
# FigurativeKeeps ("keep it short"), BareHolds (the YAML calls it the loudest
# rule and says to disable it where the container sense is kept),
# ExplainerHeadings ("Where a rule can go" is the right heading),
# AffirmativeFormulas and SequencingMarkers (both fire on "The first lesson",
# the project's noun), VerbTricolonDensity (its parent is a House copy),
# ColonUsage (the specs' "**Purpose:**" label, product names; Google.Colons
# is off for the same reason).

# The topic, competency and bibliography data. Vale reads YAML as plain
# text (keys included); the style rules are noise on short definitions and
# titles, so only the base style (term casing) runs. cspell spells it.
# Readability: seven whole-file scores that agree with each other at 0.89 or
# better, so one is enough. Flesch-Kincaid grade, threshold 8 (set inside the
# package), lessons only: that is the material with a reader whose time the
# score measures. On the plan notes it fires on every file forever. One
# alert per file at line 1; find the long sentences yourself, or run
# `mise run prose-metrics -- Readability` for every file's score.
[site/src/content/docs/**/*.{md,mdx}]
# The citation pattern again (a scoped section replaces the parent's
# TokenIgnores), plus the one quoted statutory term a lesson must use as
# written: Article 5(1) of the EU AI Act bans practices that cause
# "significant harm", and the lesson quotes it. Only the exact quoted
# phrase is ignored, so a bare "significant" still fails. The `\s` also
# matches a line break, so the phrase is ignored where a paragraph wraps
# between its words (issue #453).
TokenIgnores = (\(@[^)]+\)), ("significant\sharm")
Readability.FleschKincaid = warning
# The ratchet. Every ai-tells register rule and House copy that read zero
# in the lessons after the sweep is an error here, so new lesson text
# can't bring the pattern back. The three left out (SemicolonUsage,
# CataphoricForecasting, NegatedObject) still match inside illustrative
# <Prompt> and <Response> transcripts and stay warnings. When one of
# those reaches zero, add it.
ai-tells.FigurativeShape = error
