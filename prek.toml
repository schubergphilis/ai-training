# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json
#
# Supply chain, same rule as `.mise.toml`: nothing a hook executes may be
# resolved from a registry at install time. So:
#
# - Every remote hook repo is pinned to a full commit SHA, not a tag,
#   because a tag can be moved. The tag it was taken from is in the
#   comment; refresh both together (`git ls-remote --tags <repo>`, and
#   take the `^{}` line for an annotated tag).
# - Python hooks list their whole transitive tree in
#   `additional_dependencies`, exact-pinned. prek builds a hook's
#   environment from the hook repo's own metadata, which is ranges, so
#   with only the direct plugins listed everything underneath them would
#   float. `uv pip compile` over the direct pins produces the list; the
#   rerun command is next to each list.
# - Node tools (markdownlint-cli2, commitlint) are not installed by prek.
#   They are devDependencies in `site/package.json`, locked by
#   `site/bun.lock`, and run from `site/node_modules/.bin` as `system`
#   hooks through the `bun` pinned in `.mise.toml`, so no system `node` is
#   needed or used. `mise run site-install-frozen` (or `site-install`) has
#   to have run first; `mise run ci` and CI already do it in that order.
# - The Python interpreter for the Python hooks is prek's own (a
#   uv-managed CPython, not the mise one). The pinned trees below were
#   compiled for 3.14 and hold for CPython 3.11 and later; below 3.11 both
#   hook repos add `tomli`, so a rerun of the compile command on an older
#   interpreter would print a longer list.

minimum_prek_version = "0.3.0"
# Every hook without its own `stages` runs before a commit and again
# before a push, on the files the push changes. The push run catches a
# commit that skipped the pre-commit hooks, and the pre-push-only prose
# hooks at the end of this file run there too (docs/agents/testing.md,
# "Before a push").
default_stages = ["pre-commit", "pre-push"]
default_install_hook_types = ["pre-commit", "commit-msg", "pre-push"]

# pre-commit-hooks 6.0.0 has one runtime dependency, ruamel.yaml. It is
# pinned on every hook so they share one environment and none of them
# resolves it from PyPI. Rerun to refresh:
#   echo 'pre-commit-hooks==6.0.0' | uv pip compile --python-version 3.14 --exclude-newer <7 days ago> -
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c" # v6.0.0
hooks = [
  { id = "trailing-whitespace", exclude = '\.mdx?$', additional_dependencies = ["ruamel.yaml==0.19.1"] },
  { id = "end-of-file-fixer", exclude = '\.svg$', additional_dependencies = ["ruamel.yaml==0.19.1"] },
  { id = "check-yaml", additional_dependencies = ["ruamel.yaml==0.19.1"] },
  { id = "check-toml", additional_dependencies = ["ruamel.yaml==0.19.1"] },
  { id = "check-merge-conflict", additional_dependencies = ["ruamel.yaml==0.19.1"] },
  { id = "check-added-large-files", additional_dependencies = ["ruamel.yaml==0.19.1"] },
]

# Markdown formatting
[[repos]]
repo = "https://github.com/hukkin/mdformat"
rev = "82912cdaea4fb830f751504486a7879c70526547" # 1.0.0
hooks = [
  {
    id = "mdformat",
    # The two plugins, then their full transitive tree (see the header).
    # Rerun to refresh, and keep the mdformat line equal to the rev above:
    #   printf 'mdformat==1.0.0\nmdformat-gfm==1.0.0\nmdformat-frontmatter==2.1.2\n' | uv pip compile --python-version 3.14 --exclude-newer <7 days ago> -
    additional_dependencies = [
      "mdformat-gfm==1.0.0",
      "mdformat-frontmatter==2.1.2",
      "markdown-it-py==4.2.0",
      "mdit-py-plugins==0.6.1",
      "mdurl==0.1.2",
      "ruamel.yaml==0.19.1",
      "wcwidth==0.8.3",
    ],
    # .mdx uses JSX-flavoured markdown that mdformat mangles; skip it.
    exclude = '\.mdx$'
  }
]

# Python lint and format. The rev is the pin: the ruff-pre-commit repo at
# the commit tagged vX.Y.Z depends on ruff==X.Y.Z exactly, so no
# additional_dependencies entry is needed. Keep the tag equal to `ruff` in
# pyproject.toml's dev group.
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "2eeb5678de71a00c0902cbda7105d328432f72cb" # v0.16.8
hooks = [
  { id = "ruff-check", args = ["--fix"] },
  { id = "ruff-format" },
]

# Markdown linting, from the bun-locked install in site/ (see the header).
# Config: .markdownlint-cli2.jsonc at the repo root.
[[repos]]
repo = "local"
hooks = [
  {
    id = "markdownlint-cli2",
    name = "markdownlint-cli2",
    entry = "bun site/node_modules/.bin/markdownlint-cli2",
    language = "system",
    types = ["markdown"],
    exclude = '\.mdx$',
  }
]

# Broken link checking (uses locally installed lychee)
[[repos]]
repo = "local"
hooks = [
  {
    id = "lychee",
    name = "lychee (broken link check)",
    entry = "bash -c 'lychee --no-progress --config .lychee.toml \"$@\"' --",
    language = "system",
    types_or = ["markdown", "mdx", "yaml"],
    # A network check, so never on a push (see `mise run links`).
    stages = ["pre-commit"],
  }
]

# Secret detection
[[repos]]
repo = "local"
hooks = [
  {
    id = "gitleaks",
    name = "gitleaks (secret detection)",
    entry = "gitleaks detect --no-banner --verbose",
    language = "system",
    pass_filenames = false
  }
]

# Commit message linting, from the bun-locked install in site/ (see the
# header). The config sits next to the install because commitlint resolves
# its `extends` from the config file's directory.
[[repos]]
repo = "local"
hooks = [
  {
    id = "commitlint",
    name = "commitlint",
    entry = "bun site/node_modules/.bin/commitlint --config site/commitlint.config.mjs --edit",
    language = "system",
    stages = ["commit-msg"],
    pass_filenames = false,
    always_run = true,
  }
]

# The prose checks of `mise run spell` and `mise run prose`, before a push
# only, over the Markdown, MDX and data YAML the push changes. The file
# rules match the two tasks in .mise.toml. No agent pushes to `main`,
# but a builder branch in integration mode gets no pull request run until
# its wave branch opens one, and these catch what CI would reject there
# before the push. `mise run lint` runs the pre-commit stage, so these
# don't run twice in `ci`.
#
# The two Vale hooks run the package check and the rewrite from the
# `depends` of `mise run prose`, in the same order, and then Vale:
# `prose-check-packages` stops when a package is not synced, and
# `prose-widen` (scripts/vale_linebreaks.py) rewrites the synced rules to
# match across a line break (issue #454). They don't run
# `prose-check-configs`. The rewrite is local, takes well under a second and
# changes nothing on a second run, so a checkout synced by a bare
# `vale sync` gets the same result here as from `mise run prose`. The
# rewritten files are gitignored, so the push sees no change to the tree.
# The scripts are called directly, as the package check already is, rather
# than through mise. Both hooks set `require_serial`, so prek runs one copy
# of each at a time instead of one per batch of files, and the rewrite
# replaces each rule file in one step, so a Vale run in the other hook never
# reads a half-written rule.
[[repos]]
repo = "local"
hooks = [
  {
    id = "cspell",
    name = "cspell (changed prose)",
    entry = "bun site/node_modules/.bin/cspell --no-progress --no-must-find-files",
    language = "system",
    stages = ["pre-push"],
    files = '(\.mdx?$|^site/src/data/.*\.yaml$)',
    exclude = '^(site/examples/|docs/prose/reports/|CLAUDE\.md$)',
  },
  {
    id = "vale",
    name = "vale (changed Markdown and MDX)",
    entry = "sh -c 'scripts/prose_eval.py --check-packages .vale.ini .vale-extended.ini && scripts/vale_linebreaks.py .vale.ini .vale-extended.ini && vale --minAlertLevel=error \"$@\"' --",
    language = "system",
    stages = ["pre-push"],
    require_serial = true,
    files = '\.mdx?$',
    exclude = '^(site/examples/|docs/prose/reports/|CLAUDE\.md$|CODE_OF_CONDUCT\.md$)',
  },
  {
    id = "vale-yaml",
    name = "vale (changed data YAML)",
    entry = "sh -c 'scripts/prose_eval.py --check-packages .vale.ini .vale-extended.ini && scripts/vale_linebreaks.py .vale.ini .vale-extended.ini && vale --minAlertLevel=error --ext=.md \"$@\"' --",
    language = "system",
    stages = ["pre-push"],
    require_serial = true,
    files = '^site/src/data/.*\.yaml$',
  }
]
