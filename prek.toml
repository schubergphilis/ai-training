# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json
#
# Supply chain, same rule as `.mise.toml`: nothing a hook executes may be
# resolved from a registry at install time. So prek installs nothing
# itself. Every hook is either built into prek or a `local` `system` hook
# that runs a tool installed from a lock file with hashes:
#
# - File hygiene hooks are `builtin`: prek's own Rust implementations of the
#   pre-commit-hooks set, inside the prek binary that `.mise.toml` pins.
# - Python tools (mdformat with its plugins, and ruff) are in the dev group
#   of `pyproject.toml`, locked with hashes by `uv.lock` under its 1-week
#   `exclude-newer`, and run from `.venv/bin`. Dependabot moves them with
#   the rest of the uv group.
# - Node tools (markdownlint-cli2, commitlint, cspell) are devDependencies
#   in `site/package.json`, locked by `site/bun.lock`, and run from
#   `site/node_modules/.bin` through the `bun` pinned in `.mise.toml`, so no
#   system `node` is needed or used.
# - Binaries (gitleaks, lychee, vale) are pinned in `.mise.toml` with their
#   checksums in `mise.lock`.
#
# Before #823 the Python hooks were remote hook repos. prek built those
# from source with an unpinned setuptools and installed their pins without
# hashes. `tests/test_prek_hooks.py` fails on a remote repo, a hook with
# another language than `system`, or `additional_dependencies`.
#
# `mise run setup` installs `.venv` and `site/node_modules`, and
# `mise run ci` and CI install both before `lint`. The `types`, `args` and
# `require_serial` of the Python hooks copy the upstream
# `.pre-commit-hooks.yaml` of mdformat 1.0.0 and ruff-pre-commit v0.17.5.

minimum_prek_version = "0.3.0"
# Every hook without its own `stages` runs before a commit and again
# before a push, on the files the push changes. The push run catches a
# commit that skipped the pre-commit hooks, and the pre-push-only prose
# hooks at the end of this file run there too (docs/agents/testing.md,
# "Before a push").
default_stages = ["pre-commit", "pre-push"]
default_install_hook_types = ["pre-commit", "commit-msg", "pre-push"]

# File hygiene: prek's own Rust implementations of the pre-commit-hooks
# set (see the header). Before #823 these came from the pre-commit-hooks
# repo, and prek ran the same Rust code through its automatic fast path but
# still installed the Python package as a fallback.
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", exclude = '\.mdx?$' },
  { id = "end-of-file-fixer", exclude = '\.svg$' },
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files" },
]

# Markdown formatting, from mdformat and its plugins in .venv (see the
# header). The plugins register themselves, so the entry is plain mdformat.
[[repos]]
repo = "local"
hooks = [
  {
    id = "mdformat",
    name = "mdformat",
    entry = ".venv/bin/mdformat",
    language = "system",
    types = ["markdown"],
    # .mdx uses JSX-flavoured markdown that mdformat mangles; skip it.
    exclude = '\.mdx$',
  }
]

# Python lint and format, from the ruff in .venv, the same ruff that
# `mise run py-lint` runs (see the header). `--force-exclude` applies
# `extend-exclude` from pyproject.toml to the files prek passes.
[[repos]]
repo = "local"
hooks = [
  {
    id = "ruff-check",
    name = "ruff check",
    entry = ".venv/bin/ruff check --force-exclude --fix",
    language = "system",
    types_or = ["python", "pyi", "jupyter"],
    require_serial = true,
  },
  {
    id = "ruff-format",
    name = "ruff format",
    entry = ".venv/bin/ruff format --force-exclude",
    language = "system",
    types_or = ["python", "pyi", "jupyter", "markdown"],
    require_serial = true,
  },
]

# Markdown linting, from the bun-locked install in site/ (see the header).
# Config: .markdownlint-cli2.jsonc at the repo root.
[[repos]]
repo = "local"
hooks = [
  {
    id = "markdownlint-cli2",
    name = "markdownlint-cli2",
    entry = "bun site/node_modules/.bin/markdownlint-cli2",
    language = "system",
    types = ["markdown"],
    exclude = '\.mdx$',
  }
]

# Broken link checking (uses locally installed lychee)
[[repos]]
repo = "local"
hooks = [
  {
    id = "lychee",
    name = "lychee (broken link check)",
    entry = "bash -c 'lychee --no-progress --config .lychee.toml \"$@\"' --",
    language = "system",
    types_or = ["markdown", "mdx", "yaml"],
    # A network check, so never on a push (see `mise run links`).
    stages = ["pre-commit"],
  }
]

# Secret detection
[[repos]]
repo = "local"
hooks = [
  {
    id = "gitleaks",
    name = "gitleaks (secret detection)",
    entry = "gitleaks detect --no-banner --verbose",
    language = "system",
    pass_filenames = false
  }
]

# Commit message linting, from the bun-locked install in site/ (see the
# header). The config sits next to the install because commitlint resolves
# its `extends` from the config file's directory.
[[repos]]
repo = "local"
hooks = [
  {
    id = "commitlint",
    name = "commitlint",
    entry = "bun site/node_modules/.bin/commitlint --config site/commitlint.config.mjs --edit",
    language = "system",
    stages = ["commit-msg"],
    pass_filenames = false,
    always_run = true,
  }
]

# The prose checks of `mise run spell` and `mise run prose`, before a push
# only, over the Markdown, MDX and data YAML the push changes. The file
# rules match the two tasks in .mise.toml. No agent pushes to `main`,
# but a builder branch in integration mode gets no pull request run until
# its wave branch opens one, and these catch what CI would reject there
# before the push. `mise run lint` runs the pre-commit stage, so these
# don't run twice in `ci`.
#
# The two Vale hooks run the package check and the rewrite from the
# `depends` of `mise run prose`, in the same order, and then Vale:
# `prose-check-packages` stops when a package is not synced, and
# `prose-widen` (scripts/vale_linebreaks.py) rewrites the synced rules to
# match across a line break (issue #454). They don't run
# `prose-check-configs`. The rewrite is local, takes well under a second and
# changes nothing on a second run, so a checkout synced by a bare
# `vale sync` gets the same result here as from `mise run prose`. The
# rewritten files are gitignored, so the push sees no change to the tree.
# The scripts are called directly, as the package check already is, rather
# than through mise. Both hooks set `require_serial`, so prek runs one copy
# of each at a time instead of one per batch of files, and the rewrite
# replaces each rule file in one step, so a Vale run in the other hook never
# reads a half-written rule.
[[repos]]
repo = "local"
hooks = [
  {
    id = "cspell",
    name = "cspell (changed prose)",
    entry = "bun site/node_modules/.bin/cspell --no-progress --no-must-find-files",
    language = "system",
    stages = ["pre-push"],
    files = '(\.mdx?$|^site/src/data/.*\.yaml$)',
    exclude = '^(site/examples/|docs/prose/reports/|CLAUDE\.md$)',
  },
  {
    id = "vale",
    name = "vale (changed Markdown and MDX)",
    entry = "sh -c 'scripts/prose_eval.py --check-packages .vale.ini .vale-extended.ini && scripts/vale_linebreaks.py .vale.ini .vale-extended.ini && vale --minAlertLevel=error \"$@\"' --",
    language = "system",
    stages = ["pre-push"],
    require_serial = true,
    files = '\.mdx?$',
    exclude = '^(site/examples/|docs/prose/reports/|CLAUDE\.md$|CODE_OF_CONDUCT\.md$)',
  },
  {
    id = "vale-yaml",
    name = "vale (changed data YAML)",
    entry = "sh -c 'scripts/prose_eval.py --check-packages .vale.ini .vale-extended.ini && scripts/vale_linebreaks.py .vale.ini .vale-extended.ini && vale --minAlertLevel=error --ext=.md \"$@\"' --",
    language = "system",
    stages = ["pre-push"],
    require_serial = true,
    files = '^site/src/data/.*\.yaml$',
  }
]
