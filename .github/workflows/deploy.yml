name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # The site renders nothing under docs/agents/ (process docs and session
    # records), so a push that only changes those files doesn't deploy.
    paths-ignore: ["docs/agents/**"]
  workflow_dispatch:

permissions:
  contents: read

# one Pages deployment at a time; don't cancel a production deploy mid-flight
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    # Stated explicitly rather than inherited: this job only reads the
    # repo, and none of the Pages write scopes below belong to it.
    permissions:
      contents: read
    # This job only builds the site (`site-install-frozen`, `site-build`;
    # both bun-only, neither has `depends`), so only bun is installed. The
    # `install_args` below limits what mise-action installs, and this env
    # stops `mise run` from auto-installing every other [tools] entry
    # before a task. A task that needs a missing tool then fails instead
    # of downloading it. ci.yml keeps the full install.
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: Starlight's `lastUpdated: true` reads each page's git date.
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          # CI pins the mise binary: `sha256` is the hash of the extracted
          # `mise/bin/mise` from the linux-x64 archive. `.mise.toml`
          # `min_version` requires at least this version. Refresh them
          # together (docs/agents/mise-refresh.md).
          version: 2026.10.15
          sha256: e3b186d4c70627f27037be615becaf4acfb30e41fb6a1819486717dc94e4e2a9
          # Only bun (see the job-level env for the other half).
          install_args: bun
          install: true
          cache: true

      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('site/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install
        run: mise run site-install-frozen

      - name: Build
        run: mise run site-build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Setup GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
