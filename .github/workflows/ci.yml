name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same branch/PR; never cancel main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Lint, check and build
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.paths.outputs.e2e }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # `mise run lint` includes the gitleaks hook, which scans git
          # history. At the default fetch-depth of 1 it would see a single
          # commit, so CI would run a far weaker check than a developer
          # does locally while the README advertises them as the same one.
          # The `paths` step below also needs the base branch present.
          fetch-depth: 0

      # On a pull request the browser walkthrough (the `e2e` job) runs only
      # when the diff touches a file outside the skip set below. The skip
      # set is prose and its tooling: `docs/`, Markdown files outside
      # `site/`, the Vale, cspell, markdownlint and lychee configs, and the
      # license files. Lesson pages (`site/src/content/`) and the data tree
      # (`site/src/data/`) are deliberately NOT in it: the e2e specs derive
      # their lesson and checkpoint counts from the data tree and click
      # through lesson pages, so a content change can break them. A push to
      # `main` and `workflow_dispatch` always run the walkthrough.
      - name: Decide whether the browser walkthrough runs
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Not a pull request: the walkthrough runs."
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          if [ -z "$changed" ]; then
            echo "The diff is empty, which is unexpected: the walkthrough runs."
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          skip_set='^(docs/|.*\.md$|\.vale\.ini$|\.vale/|cspell-words\.txt$|\.markdownlint-cli2\.jsonc$|\.lychee\.toml$|LICENSE(-CODE)?$)'
          # A `.md` file under `site/` never skips: `site/src/content/docs/`
          # has rendered pages and `site/examples/` has fixture READMEs.
          outside="$(printf '%s\n' "$changed" | grep -Ev "$skip_set" || true; printf '%s\n' "$changed" | grep -E '^site/.*\.md$' || true)"
          if [ -z "$outside" ]; then
            echo "Every changed file is in the skip set: the walkthrough is skipped."
            printf '%s\n' "$changed"
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changed files outside the skip set: the walkthrough runs."
            printf '%s\n' "$outside"
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          # CI pins the mise binary: `sha256` is the hash of the extracted
          # `mise/bin/mise` from the linux-x64 archive. `.mise.toml`
          # `min_version` requires at least this version. Refresh them
          # together (docs/agents/mise-refresh.md).
          version: 2026.9.12
          sha256: e79ae57945034903aee8aa2ea66b4c7ca9cd4f4edd5a8a78a589cbae6d0f428a
          install: true
          cache: true

      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('site/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Cache uv dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-

      - name: Cache prek hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: ${{ runner.os }}-prek-${{ hashFiles('prek.toml') }}
          restore-keys: ${{ runner.os }}-prek-

      # These are the same steps, in the same order, as `mise run ci`. They
      # are spelled out rather than run as one `mise run ci` so a failure
      # names itself in the job summary. Keep the two lists in sync.
      - name: Install
        run: mise run site-install-frozen

      # The frozen task. A pyproject.toml change that uv.lock does not
      # reflect must fail here, because `py-install` would silently
      # re-resolve it on the runner into an unreviewed version set.
      - name: Install Python tools
        run: mise run py-install-frozen

      # The synced Vale styles are gitignored. Fetch them before the Python
      # tests, which run Vale on the synced rules (tests/test_vale_linebreaks.py),
      # and before the prose lint.
      - name: Fetch Vale styles
        run: mise run prose-sync

      - name: Lint
        run: mise run lint

      - name: Python lint (ruff)
        run: mise run py-lint

      - name: Python typecheck (basedpyright)
        run: mise run py-typecheck

      - name: Python tests (pytest)
        run: mise run py-test

      - name: Prose lint
        run: mise run prose

      - name: Spell check
        run: mise run spell

      - name: Examples
        run: mise run examples

      - name: Data tree
        run: mise run data

      - name: Check (Astro type/content check)
        run: mise run site-check

      - name: Biome (lint and format)
        run: mise run site-lint

      - name: Unit and component tests (with coverage floor)
        run: mise run site-test

      - name: Build
        run: mise run site-build

      # Reads dist/data/checkpoints.json back, so it runs after the build.
      - name: Checkpoint export
        run: mise run checkpoints

      # Reads dist/data/lessons/ back, so it runs after the build too.
      - name: Lesson bundles
        run: mise run bundles

  # The browser walkthrough is its own job so a lint or unit failure above
  # reports before the browser install and the build finish here. It builds
  # the site again rather than passing dist/ around: the build is fast and
  # the artifact plumbing is not worth the moving parts.
  # Skipped, and reported as skipped, on a pull request whose diff stays in
  # the skip set the `paths` step of the `build` job describes.
  e2e:
    name: Browser walkthrough (Playwright)
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.e2e == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          # CI pins the mise binary: `sha256` is the hash of the extracted
          # `mise/bin/mise` from the linux-x64 archive. `.mise.toml`
          # `min_version` requires at least this version. Refresh them
          # together (docs/agents/mise-refresh.md).
          version: 2026.9.12
          sha256: e79ae57945034903aee8aa2ea66b4c7ca9cd4f4edd5a8a78a589cbae6d0f428a
          install: true
          cache: true

      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('site/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      # Keyed on the lockfile: the Playwright package version pins the
      # browser build it downloads.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('site/bun.lock') }}

      - name: Install
        run: mise run site-install-frozen

      - name: Install Chromium
        run: mise run site-browser

      - name: Build and run the walkthrough
        run: mise run site-e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: site/playwright-report/
          retention-days: 7

  # Its own job, like `site-audit` would be: the scan needs network access
  # and is out of `mise run ci` for that reason. It fails on an advisory
  # against a pinned version in `uv.lock` or `site/bun.lock`, and when the
  # scanner did not open either file.
  vuln:
    name: OSV (dependency vulnerability scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          # CI pins the mise binary: `sha256` is the hash of the extracted
          # `mise/bin/mise` from the linux-x64 archive. `.mise.toml`
          # `min_version` requires at least this version. Refresh them
          # together (docs/agents/mise-refresh.md).
          version: 2026.9.12
          sha256: e79ae57945034903aee8aa2ea66b4c7ca9cd4f4edd5a8a78a589cbae6d0f428a
          # Only the scanner: the whole [tools] set is two CPythons, bun,
          # vale and more, for one binary this job needs.
          install_args: osv-scanner
          cache: true

      # The same mise-pinned osv-scanner as `mise run vuln` locally, so
      # there is no second version to keep in step.
      - name: Scan every committed lockfile against the OSV database
        run: mise run vuln

  zizmor:
    name: Zizmor (GitHub Actions audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit GitHub Actions workflows (zizmor)
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          # Pin the version: the action's default is "latest", so a zizmor
          # release could turn CI red on its own. Keep in step with
          # `zizmor` in .mise.toml, which is what `mise run audit` uses.
          version: "1.30.1"
          # `collect` is deliberately unset. The action's default already
          # covers workflows, composite actions, .github/dependabot.yml and
          # .pre-commit-config.yaml, while honouring .gitignore. Do not set
          # `collect: all` — that means "and stop honouring .gitignore",
          # which sweeps in every vendored workflow under site/node_modules
          # and reports dozens of findings about other people's repos.
