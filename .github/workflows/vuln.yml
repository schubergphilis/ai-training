name: Weekly vulnerability scan

# The `vuln` job in ci.yml scans the lockfiles on every push and pull
# request, so an advisory that is already published fails the change that
# touches the tree. This workflow covers the other case: an advisory
# published against a version that is already pinned on `main`, while
# nobody pushes. It runs the same `mise run vuln` on `main` once a week.
# Dependabot alerts don't replace it: GitHub's dependency graph reads
# `package.json` and not `site/bun.lock`, so it sees a few dozen of the
# several hundred npm packages the scanner reads.
#
# There is no notifier. GitHub emails the person who last changed the
# `cron` line below when a scheduled run fails, and an advisory without a
# fix keeps the run red until a fix ships, the dependency is replaced, or
# the maintainer adds an expiring entry to `osv-scanner.toml` (AGENTS.md,
# Supply chain).
#
# In a public repository GitHub disables a scheduled workflow after 60
# days without repository activity. That is the same quiet period this
# workflow exists for. A Monday with no run under Actions means the
# schedule needs re-enabling there, and a quiet quarter isn't a sign that
# the scan is passing.
on:
  schedule:
    # Mondays at 06:17 UTC. Off the hour, because GitHub delays runs
    # scheduled at the top of the hour when the queue is busy.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Keep these steps identical to the `vuln` job in ci.yml: the same
  # SHA-pinned actions and the same mise `version` and `sha256`.
  vuln:
    name: OSV (dependency vulnerability scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # CI pins the mise binary: `sha256` is the hash of the extracted
          # `mise/bin/mise` from the linux-x64 archive. `.mise.toml`
          # `min_version` requires at least this version. Refresh them
          # together (docs/agents/mise-refresh.md).
          version: 2026.9.12
          sha256: e79ae57945034903aee8aa2ea66b4c7ca9cd4f4edd5a8a78a589cbae6d0f428a
          # Only the scanner: the whole [tools] set is two CPythons, bun,
          # vale and more, for one binary this job needs.
          install_args: osv-scanner
          cache: true

      # The same mise-pinned osv-scanner as `mise run vuln` locally, so
      # there is no second version to keep in step.
      - name: Scan every committed lockfile against the OSV database
        run: mise run vuln
