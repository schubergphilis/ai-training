# mise: https://mise.jdx.dev/
#
# `mise install` installs everything under [tools]; `mise run <task>` runs
# the tasks below. `mise run ci` is the full gate.

# CI pins mise to this release (`version` and `sha256` on every mise-action
# step). This is a floor and requires at least that version locally.
# Refresh them together: docs/agents/mise-refresh.md (`mise run mise-refresh`).
min_version = "2026.9.12"

[settings]
minimum_release_age = "7d"
lockfile = true

# Every tool is pinned to an exact version, deliberately and without
# exception. This is a supply-chain rule, not a stability one: an upstream
# compromise must never be auto-downloaded. A blanket "pin everything,
# update mechanically" policy is far easier to review than a
# per-dependency judgement about which upstreams are trustworthy enough to
# float.
#
# The cost is that nothing here is covered by dependabot, so these go stale
# silently. Refresh them deliberately with `mise up`, and read the diff.
[tools]
bun = "1.4.2"
gitleaks = "8.30.1"
lychee = "0.24.2"
prek = "0.5.2"
# Used by `mise run audit`; must match `version:` in the workflow's zizmor
# job. Bump them together.
zizmor = "1.30.1"
# Used by `mise run lint`. actionlint shells out to shellcheck for the
# `run:` blocks in workflows, and silently skips that half if shellcheck is
# missing, so shellcheck is pinned here too rather than left to the host.
actionlint = "1.7.12"
shellcheck = "0.11.0"
# Two interpreters, both for `mise run examples`. The first is the current
# Python and the `python3` on PATH. The second is the floor for the lesson
# fixtures under site/examples/ (spec S03 "Examples"), on PATH as
# `python3.9`: a learner on a stock Mac types `python3` and gets 3.9, so
# every fixture must print the lesson's answer there too, and the runner
# executes each fixture on both. Pinned here rather than fetched by uv at
# task time so mise.lock holds its checksum like every other tool.
python = ["3.14.7", "3.9.25"]
# Installs the pinned Python dev tools (ruff, basedpyright, pytest) from
# uv.lock into .venv (`mise run py-install-frozen`).
uv = "0.12.13"
# Prose lint (`mise run prose`). Its style packages are pinned by URL in
# .vale.ini and fetched by `mise run prose-sync`.
vale = "3.20.0"
# Used by `mise run vuln`. Unlike zizmor there is no second version to
# keep in step: the CI `vuln` job runs `mise run vuln` through mise-action,
# so this pin is the single source of truth for local and CI alike.
osv-scanner = "2.6.0"
# Used by `mise run mise-refresh` to verify the signature on a mise
# release's SHASUMS256.txt (docs/agents/mise-refresh.md). 0.12 was
# published on 2025-01-15, well past `minimum_release_age` above.
# The aqua registry entry for 0.12 lists three platforms (`supported_envs`
# in pkgs/jedisct1/minisign/registry.yaml of aquaproj/aqua-registry), and
# upstream ships no Intel macOS binary. `os` limits the install to those
# three, so `mise install` skips minisign elsewhere instead of failing
# (https://mise.jdx.dev/dev-tools/, "OS-Specific Tools"). The gap is in
# docs/agents/mise-refresh.md.
minisign = { version = "0.12", os = ["linux/x64", "macos/arm64", "windows"] }
# cspell is deliberately not here. mise's `npm:` backend records no
# checksum in mise.lock and resolves the package's dependency tree from the
# registry at install time. It is a devDependency in site/package.json
# instead, where bun.lock pins the whole tree, and `mise run spell` runs it
# from site/node_modules/.bin.

# One task for a fresh clone or worktree, safe to run again (#345). It
# installs the site and Python dependencies from their lockfiles and
# fetches the Vale packages only when one is missing, and it prints each
# step. The tasks that need an install fail fast and name this task
# (`require-setup` below and the `prose-check-packages` message).
[tasks.setup]
description = "Set up a fresh clone or worktree: frozen installs, and the Vale packages when missing"
run = """
set -e
echo "setup: installing the site dependencies from site/bun.lock"
mise run site-install-frozen
echo "setup: installing the Python dev tools from uv.lock"
mise run py-install-frozen
if scripts/prose_eval.py --check-packages .vale.ini .vale-extended.ini >/dev/null 2>&1; then
  echo "setup: the Vale packages are already under .vale/styles/, no sync needed"
else
  echo "setup: a Vale package is missing, fetching them"
  mise run prose-sync
fi
echo "setup: done"
"""

# A `depends` of every task that runs a tool from site/node_modules. In a
# fresh worktree it stops with the task to run instead of "Script not
# found" from bun. Checks one binary, so it costs nothing.
[tasks.require-setup]
description = "Fail with a pointer to `mise run setup` when site/node_modules is missing"
hide = true
run = """
if [ ! -x site/node_modules/.bin/astro ] || [ ! -x site/node_modules/.bin/cspell ]; then
  echo "site/node_modules is missing or incomplete. Run 'mise run setup' first." >&2
  exit 1
fi
"""

# Deliberately NOT --frozen-lockfile: this is the task you run while
# actually changing dependencies, and it is allowed to update bun.lock.
# `site-install-frozen` is the one the gate uses.
[tasks.site-install]
description = "Install the site dependencies (bun); may update bun.lock"
dir = "site"
run = "bun install"

# A lockfile CI is willing to regenerate is not a pin. Without
# --frozen-lockfile a package.json change that bun.lock does not reflect is
# silently resolved on the runner, and the resolved versions are then
# whatever was newest at that moment — exactly the auto-download this
# repo's pinning policy exists to prevent. This has already happened once
# here: bun.lock's recorded constraints had drifted from package.json.
[tasks.site-install-frozen]
description = "Install the site dependencies, failing if bun.lock is out of date"
dir = "site"
run = "bun install --frozen-lockfile"

[tasks.site-dev]
description = "Start the live-reloading dev server"
depends = ["require-setup"]
dir = "site"
run = "bun run dev"

[tasks.site-build]
description = "Build the static site into site/dist"
depends = ["require-setup"]
dir = "site"
run = "bun run build"

[tasks.site-preview]
description = "Preview the production build"
depends = ["require-setup"]
dir = "site"
run = "bun run preview"

# Every fixture runs on both pinned interpreters (`python3` and
# `python3.9`, see [tools]); the runner fails if either is missing.
[tasks.examples]
description = "Run every lesson example fixture on the current Python and the 3.9 floor, asserting the output the lesson shows"
depends = ["require-setup"]
dir = "site"
run = "bun scripts/check-examples.mjs"

# The data tree under site/src/data (groups, areas, topics, competencies,
# alignment, courses, lessons; specs S09 to S11) must agree with itself and
# with the lesson pages. site/scripts/lib/data.mjs lists what it rejects in
# its header comment.
[tasks.data]
description = "Check the data tree (areas, topics, competencies, courses, lessons) against itself and the lesson pages"
depends = ["require-setup"]
dir = "site"
run = "bun scripts/check-data.mjs"

# The wave picker (scripts/next_wave.py, #492). It reads the lessons of
# this checkout from `lesson-plan` (so it needs the site install) and the
# open issues from GitHub (network, gh).
[tasks.next-wave]
description = "Pick the next wave of issues for meta-orchestration (docs/agents/meta-orchestration.md), with -- --size N, --kind lessons|content|code|harness, --only N,N,..., --unblockers-first and --json"
depends = ["require-setup"]
run = "uv run --locked python scripts/next_wave.py"

# What the wave picker needs about the lessons, as JSON
# (site/scripts/lesson-plan.mjs): the one place it reads the site.
[tasks.lesson-plan]
description = "The planned and live lessons the wave picker reads, as JSON"
depends = ["require-setup"]
dir = "site"
run = "bun scripts/lesson-plan.mjs"

# What a resuming wave lead needs (#351): per issue, the pushed
# `feat/<issue>-*` branches and per branch the last `Verdict:` comment and
# next step (#417), counting only the accounts in TRUSTED_VERDICT_AUTHORS
# (scripts/wave_status.py), plus the wave branch and the local worktrees,
# as JSON. With `--claims-and-follow-ups <issue>...` it prints instead the
# trusted follow-ups and claim comments on those issues (#605), which the
# /wave dispatcher reads. Network (git ls-remote, gh).
[tasks.wave-status]
description = "State of a wave for a resuming lead, as JSON: mise run wave-status -- <wave-branch> <issue>..."
run = "uv run --locked python scripts/wave_status.py"

# The numbers of a harness review (#355, docs/agents/harness-review.md):
# tokens, tool calls, sleeps, human messages and more, from the Claude Code
# transcript directories it is given. Read-only; `--json PATH` writes the
# numbers too.
[tasks.harness-metrics]
description = "Harness review numbers from session transcripts: mise run harness-metrics -- [--since D] [--json P] [--config F] [LABEL=]DIR..."
run = "uv run --locked python scripts/harness_metrics.py"

# Names for dispatcher runs (#353): the open `dispatcher-run` issues and the
# name the next run takes, from .claude/skills/wave/run-names.txt, as JSON.
# `-- --check N` also says whether an older open run holds the name of run
# issue #N. `-- --exclusive <kind>` or `-- --resume <Name>` adds the harness
# exclusivity check and exits 3 when it refuses the run (combine
# `--exclusive` with `--check N` after the run issue is created). The rules
# are in scripts/run_name.py. Network (gh).
[tasks.run-name]
description = "Open dispatcher runs and the next run name, as JSON: mise run run-name [-- [--check <issue>] [--exclusive <kind>] [--resume <Name>]]"
run = "uv run --locked python scripts/run_name.py"

# The brief a builder or reviewer reads an issue through (#606): title,
# state, labels, the body when a trusted account opened the issue, and only
# the comments by the trusted accounts of scripts/wave_status.py, Decision
# and Triage comments first. It counts the other comments and never prints
# them. Network (gh).
[tasks.issue-brief]
description = "One issue with only its trusted comments, decisions first: mise run issue-brief -- <issue>"
run = "uv run --locked python scripts/issue_brief.py"

# Branch cleanup, for human maintainers only: no agent runs this task,
# also not as a dry run. It lists the remote branches that are merged into
# `main` (every commit's patch is in `main`) and older than 14 days, or
# `-- --days N`, and with `-- --apply` deletes them on GitHub and locally.
# It stops at the first `gh` or `git` error. The rules are in
# scripts/branch_cleanup.py, and the guard-bash hook rejects the task for
# agents. Network (gh).
[tasks.branch-cleanup]
description = "Humans only: list merged remote branches older than 14 days; delete with -- --apply: mise run branch-cleanup [-- --days N] [--apply]"
run = "uv run --locked python scripts/branch_cleanup.py"

# The build writes the checkpoint export (spec S03 "Checkpoint export") to
# site/dist/data/checkpoints.json from src/pages/data/checkpoints.json.ts.
# This reads it back and checks it against the lesson pages and the topic
# YAML, so it runs after `site-build`.
# site/scripts/lib/checkpoints.mjs lists what it rejects in its header comment.
[tasks.checkpoints]
description = "Check the built checkpoints.json export against the lesson pages and the topic concepts, and choice items for surface cues (after site-build)"
depends = ["require-setup"]
dir = "site"
run = "bun scripts/check-checkpoints.mjs"

# The build writes one lesson bundle (spec S08 "Lesson bundles") per lesson
# page to site/dist/data/lessons/<area>/<lesson>.json. This reads them back
# and checks them against the lesson pages, so it runs after `site-build`.
# site/scripts/lib/bundles.mjs lists what it rejects in its header comment.
# It also compares each built data-tree file (spec S12 "Data tree as JSON",
# dist/data/<kind>/<id>.json) with its YAML source, and checks that
# dist/data/index.json lists each of them.
# The same run rejects a `(@key)` citation left unresolved in the text of any
# built HTML page (site/scripts/lib/rendered-citations.mjs).
[tasks.bundles]
description = "Check the built lesson bundles under dist/data/lessons against the lesson pages: one per page, every S08 field, fenced code unchanged; each built S12 data file against its YAML and dist/data/index.json; and no unresolved (@key) citation in a built HTML page (after site-build)"
depends = ["require-setup"]
dir = "site"
run = "bun scripts/check-bundles.mjs"

[tasks.site-check]
description = "Astro type/content check"
depends = ["require-setup"]
dir = "site"
run = "bunx astro check"

# Biome does both lint and format for the site's TypeScript, JavaScript,
# JSON and the frontmatter of .astro files. It does not see the template or
# the inline <script> blocks (`site-check` covers those; logic that needs a
# lint or a unit test goes in site/src/scripts). One config: site/biome.json.
[tasks.site-lint]
description = "Biome lint + format check over site/ (config: site/biome.json)"
depends = ["require-setup"]
dir = "site"
run = "bun run lint"

[tasks.site-format]
description = "Biome: rewrite site/ files in the house format"
depends = ["require-setup"]
dir = "site"
run = "bun run format"

# Vitest with the Astro Vite config, so tests see the same aliases and
# virtual modules as the build. The 80% coverage floor in vitest.config.ts
# fails the task when missed. docs/agents/testing.md says which layer tests
# what.
[tasks.site-test]
description = "Vitest unit and component tests with the coverage floor"
depends = ["require-setup"]
dir = "site"
run = "bun run test"

# Playwright starts and stops the static server site/scripts/serve-dist.mjs
# itself (playwright.config.ts `webServer`; not `astro preview`, which
# detaches), so this task only has to build first. `mise run site-e2e --
# e2e/review.spec.ts` runs one spec.
[tasks.site-e2e]
description = "Build, then run the Playwright walkthrough in site/e2e/. Needs `mise run site-browser` once."
depends = ["require-setup"]
dir = "site"
run = ["bun run build", "bun run e2e"]

# The `ci` list runs this after `site-build`, so the site is built once.
# `site-e2e` above stays the one-command form for local use.
[tasks.site-e2e-only]
description = "Run the Playwright walkthrough against an existing site/dist (after site-build). Needs `mise run site-browser` once."
depends = ["require-setup"]
dir = "site"
run = "bun run e2e"

[tasks.site-favicon]
description = "Regenerate the favicon + apple-touch-icon from the palette"
depends = ["require-setup"]
dir = "site"
run = "bun run scripts/gen-favicon.mjs"

# Not part of `ci`: this hits the registry's advisory API, so it flakes on
# network the same way `links` does. Anything it reports gets pinned up
# through the `overrides` block in site/package.json — see AGENTS.md.
[tasks.site-audit]
description = "bun audit of the site dependency tree (network; not part of `ci`)"
dir = "site"
run = "bun audit"

[tasks.site-clean]
description = "Remove build artifacts"
run = "rm -rf site/dist site/.astro"

# The Chromium build Playwright drives for `site-e2e` and `site-screenshot`.
# `--with-deps` adds the system libraries the browser needs on a Linux CI
# runner; on macOS it is a no-op.
[tasks.site-browser]
description = "Install the Chromium browser Playwright uses for site-e2e and site-screenshot"
depends = ["require-setup"]
dir = "site"
run = "bunx playwright install --with-deps chromium"

[tasks.site-screenshot]
description = "Build, serve, and screenshot a page (args: [out] [path]). Needs `mise run site-browser` once."
depends = ["require-setup"]
dir = "site"
usage = '''
arg "[out]" help="Output PNG path" default="out.png"
arg "[path]" help="Site path to capture" default="/ai-training/"
'''
run = """
bun run build
bun scripts/screenshot.mjs "$usage_out" "$usage_path"
"""

# The prek hooks (mdformat, markdownlint, gitleaks, the pre-commit-hooks
# set) are the lint stack; prek.toml is their single source of truth. Run
# them here too so the checks are enforced in CI rather than only for
# people who remembered `prek install`.
#
# The markdownlint hook runs the binary from site/node_modules/.bin through
# the pinned bun (see prek.toml), so `site-install-frozen` has to have run
# first. `ci` and ci.yml both do.
#
# `lychee` is skipped: it is a network check that flakes on rate limits and
# TLS handshakes, so it lives in `mise run links` instead of the gate.
[tasks.lint]
description = "prek hooks (mdformat, markdownlint, gitleaks) + actionlint"
depends = ["require-setup"]
run = ["prek run --all-files --skip lychee", "actionlint"]

[tasks.links]
description = "lychee broken-link check (network; not part of `ci`)"
run = "lychee --no-progress --config .lychee.toml ."

# The synced `write-good` style is gitignored; this fetches it from the
# release URL pinned in .vale.ini. Network, like `site-install-frozen`.
#
# After the fetch, scripts/vale_linebreaks.py rewrites each literal space in
# the synced patterns to `\s`, so a rule matches a phrase that a line break
# splits (issue #371). The same step runs before every `prose` run
# (`prose-widen`), so a package synced before the script existed is
# rewritten too.
#
# The first step removes .vale/styles/.vale-config/ when a package left it
# there (issue #450): while it exists, `vale sync` unpacks into
# .vale/styles/.vale-config/styles/ instead. So `setup`, which runs this
# task when `prose-check-packages` fails, repairs such a checkout.
[tasks.prose-sync]
description = "Fetch the pinned Vale style packages (network)"
run = [
  "scripts/prose_eval.py --clear-config-dir",
  "vale sync",
  "scripts/vale_linebreaks.py .vale.ini .vale-extended.ini",
]

# Rewrites the literal spaces in the synced Vale patterns to `\s`
# (scripts/vale_linebreaks.py, issue #371). Local, and a second run changes
# nothing. A package that is not synced is skipped, and
# `prose-check-packages` reports it.
[tasks.prose-widen]
description = "Make the synced Vale rules match across a line break"
hide = true
run = "scripts/vale_linebreaks.py .vale.ini .vale-extended.ini"

# Runs before `prose` and `prose-extended` (`depends`). The synced styles
# are gitignored, and in a fresh clone or worktree Vale otherwise runs with
# only the House rules and reports a clean page that isn't (issue #103).
# Each `.zip` on the top-level `Packages` key of the two configs unpacks
# to `.vale/styles/<name>/`, so a missing directory means the sync hasn't
# run. The check is `check_packages_synced` in scripts/prose_eval.py, the
# same function `prose-eval` and `prose-metrics` run on .vale-eval.ini
# (issue #295). It reads the file through `parse_ini` in
# scripts/vale_configs.py, the parser `prose-check-configs` uses (issue
# #299), so one tested parser reads every Vale config. A bare package name
# is not supported, and an empty list is a failure rather than a pass.
# Local (no network) and cheap. It does not detect a stale unpack: after
# moving a pin in the ini, run `prose-sync` again yourself.
# It also fails when .vale/styles/.vale-config/ exists, and names
# `scripts/prose_eval.py --clear-config-dir` and `prose-sync`: with that
# directory present `vale sync` writes the packages under it and the old
# ones stay, so the missing-package check alone would pass (issue #450).
[tasks.prose-check-packages]
description = "Fail when a Vale package pinned in .vale.ini or .vale-extended.ini is not under .vale/styles/"
hide = true
run = "scripts/prose_eval.py --check-packages .vale.ini .vale-extended.ini"

# .vale-extended.ini must stay a superset of .vale.ini (same TokenIgnores,
# BasedOnStyles and rule levels per section, issue #289). The script names
# the file, section and key on drift, and lists the extended-only rules.
[tasks.prose-check-configs]
description = "Fail when .vale.ini and .vale-extended.ini disagree on a shared setting"
hide = true
run = "scripts/vale_configs.py"

# Which files: every Markdown/MDX file plus the topic, competency and
# bibliography YAML under site/src/data (Vale reads YAML as plain text,
# keys included), tracked or not yet added. `--others --exclude-standard`
# takes in a new page before its `git add`, so it is checked too (#345).
# Going through `git ls-files` is what excludes site/dist, node_modules
# and the synced style package without a second ignore list.
# site/examples is left out: the fixture repos there are test inputs, not
# prose. docs/prose/reports quotes flagged sentences on purpose and would
# flag again. CLAUDE.md is a symlink to AGENTS.md and would count twice.
#
# Two passes. Vale's exit code covers everything at or above
# MinAlertLevel, with no way to print a class of finding without failing on
# it, so the first pass shows every warning and the second decides the
# outcome. Only errors (misspellings, unknown terms) block. Passive voice
# and cliches are a judgement call for a reviewer, not a build failure.
#
# The YAML goes in a separate invocation with `--ext=.md`: Vale's
# `TokenIgnores` (which hides the bibliography URLs from the term-casing
# rule, see .vale.ini) only works for markup formats, and YAML is not one.
# The `[*.{yaml,yml}]` section still selects the rules by file name.
[tasks.prose]
description = "Vale prose lint over Markdown, MDX and the site data YAML. Errors gate; warnings advise."
depends = ["prose-check-packages", "prose-check-configs", "prose-widen"]
run = """
set -e
files=$(git ls-files --cached --others --exclude-standard -- '*.md' '*.mdx' ':!site/examples/**' ':!docs/prose/reports/**' ':!CLAUDE.md' ':!CODE_OF_CONDUCT.md')
yaml=$(git ls-files --cached --others --exclude-standard -- 'site/src/data/**/*.yaml' 'site/src/data/*.yaml')
# shellcheck disable=SC2086
vale --no-exit $files
# shellcheck disable=SC2086
vale --no-exit --ext=.md $yaml
# shellcheck disable=SC2086
vale --minAlertLevel=error $files
# shellcheck disable=SC2086
vale --minAlertLevel=error --ext=.md $yaml
"""

# Same files, the extended config (.vale-extended.ini) that also enables the
# passive-voice rule. Advisory: it never fails, and most hits are idiom.
# Run it every so often and rewrite the sentences that hide who does what.
[tasks.prose-extended]
description = "Vale prose lint with the extended (passive-voice) rules; advisory only"
depends = ["prose-check-packages", "prose-check-configs", "prose-widen"]
run = """
set -e
files=$(git ls-files --cached --others --exclude-standard -- '*.md' '*.mdx' ':!site/examples/**' ':!docs/prose/reports/**' ':!CLAUDE.md' ':!CODE_OF_CONDUCT.md')
yaml=$(git ls-files --cached --others --exclude-standard -- 'site/src/data/**/*.yaml' 'site/src/data/*.yaml')
# shellcheck disable=SC2086
vale --no-exit --config .vale-extended.ini $files
# shellcheck disable=SC2086
vale --no-exit --config .vale-extended.ini --ext=.md $yaml
"""

# Evaluate a Vale style package before deciding, rule by rule, where it
# goes (.vale.ini, .vale-extended.ini or off). Every hit as JSON plus word
# counts per area, into docs/prose/reports/<package>/. See docs/prose/README.md.
# Both scripts read .vale-eval.ini, whose packages `prose-sync` does not
# fetch, and stop with a message naming `prose-eval-sync` when one is not
# under .vale/styles/ (the eval side of #103, issues #276 and #295).
# The last step removes .vale/styles/.vale-config/, which the Harper zip
# ships and which would redirect the next `prose-sync` into
# .vale/styles/.vale-config/styles/ (issue #450). It removes that one
# directory and nothing else (`clear_config_dir` in scripts/prose_eval.py).
[tasks.prose-eval-sync]
description = "Fetch the Vale packages pinned in .vale-eval.ini, for prose-eval and prose-metrics (network)"
run = [
  "vale sync --config .vale-eval.ini",
  "scripts/vale_linebreaks.py .vale-eval.ini",
  "scripts/prose_eval.py --clear-config-dir",
]

# The eval side of `prose-widen`, for a package synced before
# scripts/vale_linebreaks.py existed.
[tasks.prose-widen-eval]
description = "Make the synced Vale eval rules match across a line break"
hide = true
run = "scripts/vale_linebreaks.py .vale-eval.ini"

[tasks.prose-eval]
description = "Collect every hit of a Vale package for review: mise run prose-eval -- <package>"
depends = ["prose-widen-eval"]
run = "scripts/prose_eval.py"

[tasks.prose-metrics]
description = "Score every file on a Vale metric package (Readability) for docs/prose/reports"
depends = ["prose-widen-eval"]
run = "scripts/prose_metrics.py"

# Python quality tools (ruff, basedpyright, pytest) for scripts/, tests/ and
# the lesson fixtures under site/examples/. pyproject.toml holds their
# config, and uv.lock pins them. The same frozen/unfrozen split as the bun
# tasks above: `py-install` may relock, and `py-install-frozen` (`--locked`)
# is what the gate runs and fails on a stale lock. The three check tasks
# also pass `--locked`, so a local `mise run py-lint` after editing a pin
# fails instead of rewriting uv.lock and checking with unreviewed tools.
[tasks.py-install]
description = "uv sync of the Python dev tools; may update uv.lock"
run = "uv sync --all-groups"

[tasks.py-install-frozen]
description = "uv sync of the Python dev tools, failing if uv.lock is out of date"
run = "uv sync --all-groups --locked"

[tasks.py-lint]
description = "ruff check + ruff format --check over every .py file"
run = ["uv run --locked ruff check .", "uv run --locked ruff format --check ."]

[tasks.py-format]
description = "ruff format + ruff check --fix"
run = ["uv run ruff format .", "uv run ruff check --fix ."]

# Two configs on purpose: strict for the repo's own code (pyproject.toml)
# and `standard` at Python 3.9 for the lesson fixtures
# (site/examples/pyrightconfig.json). basedpyright has no per-directory
# typeCheckingMode.
[tasks.py-typecheck]
description = "basedpyright: strict over scripts/ and tests/, standard (py39) over site/examples/"
run = ["uv run --locked basedpyright", "uv run --locked basedpyright -p site/examples"]

# tests/ only. The unittest file in a lesson fixture repo is lesson content
# the learner runs, and `mise run examples` asserts the fixture output.
[tasks.py-test]
description = "pytest over tests/ with coverage of scripts/ (floor 80%)"
run = "uv run --locked pytest"

# Spell check in American English over the same files as `prose`. cspell's
# en-US dictionary is separate from en-GB, so British spellings fail. Names
# and jargon go in cspell-words.txt; inline code spans are skipped. cspell
# comes from the bun-locked site install (see [tools]) and runs through
# the pinned bun, so no system node is involved. `site-install-frozen` has
# to have run first. `ci` and ci.yml both do.
[tasks.spell]
description = "cspell (American English) over Markdown, MDX and the site data YAML"
depends = ["require-setup"]
run = """
set -e
files=$(git ls-files --cached --others --exclude-standard -- '*.md' '*.mdx' 'site/src/data/**/*.yaml' 'site/src/data/*.yaml' ':!site/examples/**' ':!docs/prose/reports/**' ':!CLAUDE.md')
# shellcheck disable=SC2086
bun site/node_modules/.bin/cspell --no-progress $files
"""

# Sequential rather than `depends`, which mise runs in parallel:
# `site-check` and `site-build` both write `site/.astro`. The workflow runs
# the same list as separate steps for readable logs — keep the two in sync.
# `site-e2e-only` is last because it needs `site-build`'s dist and the
# browser from `site-browser`; in the workflow the walkthrough is its own
# job after the build, so there it runs `site-e2e` (build and run).
#
# A loop instead of a `run` list, so the last line names the task that
# failed and the exit code stays non-zero (#345). `mise run ci | tail`
# loses the exit code, and the line is what is left.
[tasks.ci]
description = "Full CI gate: install + lint + Python lint/typecheck/test + prose + spell + examples + course plans + Astro check + Biome + unit tests + build + checkpoint export + lesson bundles + e2e"
run = """
set -u
for task in site-install-frozen py-install-frozen prose-sync lint py-lint py-typecheck py-test prose spell examples data site-check site-lint site-test site-build checkpoints bundles site-e2e-only; do
  if ! mise run "$task"; then
    echo "ci: FAILED in task '$task'. Rerun it with 'mise run $task'."
    exit 1
  fi
done
echo "ci: passed, every task green"
"""

# The `ci` list without the network installs and without the browser
# walkthrough: the builder's definition of done and the check every fix
# commit runs (docs/agents/orchestration.md). Run `mise run setup` once in
# a fresh worktree first. The wave branch's `mise run ci` is the one e2e
# run of a wave.
[tasks.fast]
description = "The ci list without the installs and the e2e walkthrough (run `mise run setup` once first)"
run = """
set -u
for task in lint py-lint py-typecheck py-test prose spell examples data site-check site-lint site-test site-build checkpoints bundles; do
  if ! mise run "$task"; then
    echo "fast: FAILED in task '$task'. Rerun it with 'mise run $task'."
    exit 1
  fi
done
echo "fast: passed, every task green"
"""

# Local mirror of the `zizmor` CI job, using the mise-pinned zizmor. Not
# part of `ci` because it needs network access and a GitHub token for the
# online audits.
#
# Without a token zizmor silently falls back to offline and skips the
# `impostor-commit` and `known-vulnerable-actions` audits, which is an
# unverified result, not a pass — so refuse to run rather than exit 0 on a
# weaker check than the name promises.
#
# There is deliberately no `--collect` here. zizmor's default already
# collects every kind of input — workflows, composite actions, the
# dependabot config and `.pre-commit-config.yaml` — while honouring
# .gitignore. (The one-line summary in `--help` says "workflows and
# composite actions"; that sentence is stale and the enum below it is what
# the code does. Checked with `zizmor -v`, which logs each input it
# registers.)
#
# `--collect=all` is the trap: it means "collect every kind *and ignore
# .gitignore*", so after `mise run site-install` it sweeps in every
# vendored workflow under site/node_modules — 53 findings about other
# people's repositories. Naming kinds explicitly avoids that too, but is
# strictly narrower than the default and silently drops pre-commit
# coverage. Omitting the flag is both simpler and broader.
[tasks.audit]
description = "zizmor audit of workflows, actions and the dependabot config"
run = """
set -e
GH_TOKEN=$(gh auth token 2>/dev/null) || true
if [ -z "$GH_TOKEN" ]; then
  echo "No GitHub token: run \\`gh auth login\\`. Refusing to run a" >&2
  echo "partial audit — the online audits would be silently skipped." >&2
  exit 1
fi
export GH_TOKEN
zizmor --strict-collection .
"""

# Scans every committed lockfile (`uv.lock` and `site/bun.lock`) against
# the OSV database. Not part of `ci` for the same reason as `site-audit`
# and `links`: it needs network access. CI runs it in its own `vuln` job,
# and `.github/workflows/vuln.yml` runs it on `main` once a week.
# `site-audit` stays as well: `bun audit` reads the registry's advisory
# feed and OSV is a second database, so the two overlap but don't agree
# on every advisory.
#
# Unlike `audit` this needs no token and fails loudly when the database
# is unreachable, so there is no silent-downgrade case to guard against.
#
# Each lockfile is named with `-L` rather than found by a directory walk
# (`-r .`), so a lesson fixture that commits a lockfile with a deliberately
# old version (spec S03 "Examples") is never swept in, and a lockfile that
# is missing or does not parse is the scanner's own error (exit 127)
# instead of a silently narrower scan. The list comes from `git ls-files`,
# and an empty list fails: adding a package manager means adding its
# lockfile to the glob list here. A lockfile that parses to zero packages
# prints a warning and passes: the scanner gives no exit code for it, and
# an empty dependency group is a real state, not an error.
#
# `--config` names the root `osv-scanner.toml` for every lockfile. Without
# it the scanner looks for a config next to each lockfile, so the file
# would not apply to `site/bun.lock`. The file holds the maintainer's
# expiring overrides (docs/agents/supply-chain.md), and the scanner prints
# each advisory it leaves out, with the reason.
[tasks.vuln]
description = "osv-scanner audit of every committed lockfile (uv.lock, site/bun.lock) against the OSV database (network; not part of `ci`)"
run = """
set -eu
locks=$(git ls-files -- 'uv.lock' 'site/bun.lock')
if [ -z "$locks" ]; then
  echo "vuln: no committed lockfile matched. Check the glob list in .mise.toml." >&2
  exit 1
fi
args=""
for lock in $locks; do
  args="$args -L $lock"
done
status=0
# shellcheck disable=SC2086
out=$(osv-scanner scan source --config osv-scanner.toml $args 2>&1) || status=$?
echo "$out"
for lock in $locks; do
  case "$out" in
    *"/$lock file and found 0 packages"*)
      echo "vuln: warning: $lock parsed to zero packages." >&2
      ;;
  esac
done
exit "$status"
"""

# The download, verify and hash steps of docs/agents/mise-refresh.md for one
# mise release (#331). It verifies SHASUMS256.txt with the pinned minisign
# and the key in that doc's `minisign -Vm` command, checks the linux-x64
# archive against it and prints the sha256 of `mise/bin/mise` and the
# release date. It downloads into a temporary directory that it removes,
# edits no file and fails on a bad signature or a hash mismatch. The logic
# is in scripts/mise_refresh.py. Network; not part of `ci`.
[tasks.mise-refresh]
description = "Verify a mise release and print the sha256 CI pins: mise run mise-refresh <version> (network)"
usage = 'arg "<version>" help="The mise release, for example 2026.9.12"'
run = 'scripts/mise_refresh.py "$usage_version"'

[tasks.ci-watch]
description = "Watch GitHub Actions CI for the current branch; exits non-zero on failure"
run = """
sleep 5
remote_url=$(git remote get-url upstream 2>/dev/null || git remote get-url origin)
repo=$(echo "$remote_url" | sed -E 's|^.*github\\.com[:/]||; s|\\.git$||')
run_id=$(gh run list --repo "$repo" --branch "$(git branch --show-current)" --limit 1 --json databaseId --jq '.[0].databaseId')
if [ -z "$run_id" ]; then echo "No run found for current branch on $repo" >&2; exit 1; fi
gh run watch --repo "$repo" --exit-status "$run_id"
"""
